<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca - Rave</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #0f0f13; color: #fff; padding: 20px; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { text-align: center; margin-top: 10vh; margin-bottom: 30px; transition: 0.3s; }
        .header.searching { margin-top: 5vh; }
        h1 { color: #e50914; font-size: 2.5rem; margin: 0; display: flex; align-items: center; justify-content: center; gap: 10px; }
        h1 span { font-size: 2rem; }
        .search-container { width: 100%; max-width: 650px; position: relative; margin-bottom: 40px; }
        input { width: 100%; padding: 18px 24px; font-size: 18px; border-radius: 50px; border: 1px solid #333; background: #1c1c24; color: #fff; outline: none; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        input:focus { border-color: #e50914; box-shadow: 0 0 20px rgba(229, 9, 20, 0.2); background: #22222b; }
        .welcome-screen { text-align: center; color: #666; display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 50px; animation: fadeIn 0.5s ease; }
        .welcome-screen svg { width: 60px; height: 60px; opacity: 0.5; }
        #resultados { width: 100%; max-width: 650px; display: flex; flex-direction: column; gap: 12px; display: none; }
        a { color: #fff; text-decoration: none; background: #1c1c24; padding: 18px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; border-left: 4px solid transparent; animation: slideUp 0.3s ease; }
        a:hover { background: #22222b; border-left-color: #e50914; transform: translateX(5px); }
        .item-name { font-weight: 500; font-size: 16px; }
        .item-icon { color: #555; transition: 0.2s; }
        a:hover .item-icon { color: #e50914; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="header" id="header">
        <h1><span>🍿</span> Rave Search</h1>
    </div>
    <div class="search-container">
        <input type="text" id="pesquisa" placeholder="Pesquise por um filme ou série..." autocomplete="off">
    </div>
    <div class="welcome-screen" id="welcome-screen">
        <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"></path></svg>
        <p>Digite para encontrar seu próximo filme.</p>
    </div>
    <div id="resultados"></div>
    <script>
        let catalogoCompleto = [];
        const inputElement = document.getElementById('pesquisa');
        const containerResultados = document.getElementById('resultados');
        const welcomeScreen = document.getElementById('welcome-screen');
        const headerElement = document.getElementById('header');

        fetch('catalog.json')
            .then(response => response.json())
            .then(data => { catalogoCompleto = data; })
            .catch(err => console.error("Erro ao carregar catálogo:", err));

        inputElement.addEventListener('input', (e) => {
            const termo = e.target.value.toLowerCase().trim();
            if (termo.length === 0) {
                containerResultados.style.display = 'none';
                welcomeScreen.style.display = 'flex';
                headerElement.classList.remove('searching');
                return;
            }
            welcomeScreen.style.display = 'none';
            containerResultados.style.display = 'flex';
            headerElement.classList.add('searching');
            if (termo.length < 2) { containerResultados.innerHTML = ''; return; }

            const filtrados = catalogoCompleto.filter(item => item.name.toLowerCase().includes(termo));
            exibirResultados(filtrados.slice(0, 50));
        });

        function exibirResultados(itens) {
            containerResultados.innerHTML = '';
            if (itens.length === 0) {
                containerResultados.innerHTML = '<div style="text-align:center; color:#666; margin-top:20px;">Nenhum resultado encontrado.</div>';
                return;
            }
            itens.forEach(item => {
                const a = document.createElement('a');
                a.href = item.file;
                a.target = "_blank";
                const nameSpan = document.createElement('span');
                nameSpan.className = 'item-name';
                nameSpan.textContent = item.name;
                const iconSpan = document.createElement('span');
                iconSpan.className = 'item-icon';
                iconSpan.textContent = '▶';
                a.appendChild(nameSpan);
                a.appendChild(iconSpan);
                containerResultados.appendChild(a);
            });
        }
    </script>
</body>
</html>
