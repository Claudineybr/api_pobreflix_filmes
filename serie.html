<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎄 Episódios - Clau Flix</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0a1512; color: #fff; min-height: 100vh; overflow-x: hidden; }
    
    /* ================= FUNDO COM SLIDESHOW (FOTOS ESTÁTICAS) ================= */
    .bg-container {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -2; background-size: cover; background-position: center; background-repeat: no-repeat;
      transition: background-image 1.5s ease-in-out;
    }
    .bg-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -1; 
      background: linear-gradient(rgba(10, 15, 12, 0.6), rgba(10, 15, 12, 0.85)); 
    }

    header { background: rgba(15, 25, 20, 0.9); backdrop-filter: blur(10px); padding: 18px 40px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255, 183, 3, 0.3); box-shadow: 0 4px 20px rgba(230, 57, 70, 0.2); }
    .logo { font-size: 1.8rem; font-weight: 800; background: linear-gradient(45deg, #e63946, #2a9d8f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; letter-spacing: 1px; text-decoration: none; }
    .logo span { -webkit-text-fill-color: #fff; }
    .btn-voltar { color: #ffb703; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
    .btn-voltar:hover { color: #e63946; transform: translateX(-5px); }

    .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
    
    .banner-serie { width: 100%; height: 300px; border-radius: 16px; overflow: hidden; position: relative; margin-bottom: -50px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); border: 1px solid rgba(255, 183, 3, 0.4); }
    .banner-serie img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .banner-serie::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, rgba(10, 25, 20, 1) 0%, rgba(10, 25, 20, 0.4) 50%, transparent 100%); }

    .header-serie { text-align: center; margin-bottom: 40px; position: relative; z-index: 10; }
    .header-serie h1 { font-size: 2.5rem; font-weight: 800; color: #fff; margin-bottom: 5px; text-shadow: 2px 2px 8px rgba(0,0,0,0.9); }
    .header-serie p { color: #e63946; font-size: 1rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; text-shadow: 1px 1px 4px rgba(0,0,0,0.9); }

    .temporada-bloco { margin-bottom: 40px; background: rgba(15, 25, 20, 0.85); border-radius: 16px; padding: 30px; backdrop-filter: blur(10px); border: 1px solid rgba(255, 183, 3, 0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .temporada-titulo { font-size: 1.5rem; color: #fff; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .temporada-titulo::before { content: ''; width: 4px; height: 24px; background: linear-gradient(45deg, #e63946, #2a9d8f); border-radius: 2px; }

    .lista-eps { display: flex; flex-direction: column; gap: 10px; }
    .ep-item { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; background: rgba(255, 255, 255, 0.05); border-radius: 10px; text-decoration: none; color: #fff; border: 1px solid transparent; transition: all 0.2s; }
    .ep-item:hover { background: rgba(230, 57, 70, 0.2); border-color: rgba(230, 57, 70, 0.5); transform: translateX(5px); }
    
    .ep-info { display: flex; align-items: center; gap: 20px; }
    .ep-numero { font-size: 1.2rem; font-weight: 800; color: #ffb703; }
    .ep-titulo { font-size: 1.1rem; font-weight: 500; }
    .ep-play { background: rgba(255, 255, 255, 0.1); width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; transition: 0.3s; }
    .ep-item:hover .ep-play { background: #e63946; box-shadow: 0 0 15px rgba(230, 57, 70, 0.6); }

    .loading { text-align: center; font-size: 1.2rem; color: #aaa; margin-top: 50px; }
    
    .modal-player { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 10, 8, 0.98); z-index: 1000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(10px); }
    .modal-content { width: 100%; max-width: 1100px; background: #000; border-radius: 16px; overflow: hidden; position: relative; box-shadow: 0 30px 60px rgba(0,0,0,0.9); display: flex; flex-direction: column; border: 1px solid rgba(255, 183, 3, 0.3); }
    .close-btn { position: absolute; top: 20px; right: 20px; background: rgba(230, 57, 70, 0.2); color: #e63946; border: 2px solid #e63946; width: 45px; height: 45px; border-radius: 50%; font-size: 22px; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; }
    .close-btn:hover { background: #e63946; color: #fff; transform: rotate(90deg) scale(1.1); }
    #playerContainer { width: 100%; aspect-ratio: 16 / 9; background: #000; display: flex; align-items: center; justify-content: center; position: relative; }
    #playerContainer video, #playerContainer iframe { width: 100%; height: 100%; border: none; display: block; }
    .modal-footer { padding: 20px 30px; background: linear-gradient(to top, #000, #0a1512); border-top: 1px solid rgba(255, 183, 3, 0.2); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
    .modal-title { font-size: 1.4rem; margin: 0; font-weight: 700; color: #fff; }
    .btn-original { background: transparent; color: rgba(255, 255, 255, 0.6); text-decoration: none; padding: 10px 20px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; border: 1px solid rgba(255, 255, 255, 0.2); transition: 0.3s; }
    .btn-original:hover { background: rgba(255, 255, 255, 0.1); color: #fff; border-color: #fff; }

    .erro-player { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; color: #fff; }
    .erro-player h3 { color: #e63946; font-size: 1.5rem; margin-bottom: 10px; }
    .erro-player p { color: rgba(255,255,255,0.7); margin-bottom: 20px; max-width: 500px; line-height: 1.5; }
    .btn-erro { background: #e63946; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; box-shadow: 0 4px 15px rgba(230, 57, 70, 0.4); }
    .btn-erro:hover { background: #c1121f; }

    #snow-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; overflow: hidden; }
    .snowflake { position: absolute; top: -10px; color: #fff; font-size: 1.5em; font-family: Arial, sans-serif; user-select: none; pointer-events: none; animation: fall linear forwards; text-shadow: 0 0 5px rgba(255, 255, 255, 0.8); }
    @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }

    @media (max-width: 600px) {
      .banner-serie { height: 200px; margin-bottom: -30px; }
      .header-serie h1 { font-size: 1.8rem; }
      .container { margin: 20px auto; }
    }
  </style>
</head>
<body>

  <div class="bg-container" id="bg-slideshow"></div>
  <div class="bg-overlay"></div>
  <div id="snow-container"></div>

  <header>
    <a href="index.html" class="logo">Clau <span>Flix</span></a>
    <a href="index.html" class="btn-voltar">← Voltar ao Início</a>
  </header>

  <div class="container">
    <div class="banner-serie">
      <img id="capaSerie" src="" alt="Capa da Série" onerror="this.src='https://via.placeholder.com/800x400/1a1a2e/e63946?text=Sem+Capa'">
    </div>

    <div class="header-serie">
      <h1 id="tituloSerie">Carregando...</h1>
      <p id="subtituloSerie">Selecione um episódio abaixo</p>
    </div>
    
    <div id="conteudoEpisodios"><div class="loading">Buscando episódios... 🎄</div></div>
  </div>

  <div class="modal-player" id="videoModal">
    <div class="modal-content">
      <button class="close-btn" onclick="fecharModal()">✕</button>
      <div id="playerContainer"></div>
      <div class="modal-footer">
        <h3 class="modal-title" id="modalTitulo"></h3>
        <a href="#" id="linkOriginal" target="_blank" class="btn-original">🔗 Abrir no site original</a>
      </div>
    </div>
  </div>

  <script>
    // ================= SLIDESHOW DE FUNDO (SÓ AS 5 FOTOS APROVADAS) =================
    const fundos = [
      'https://images.unsplash.com/photo-1543589077-47d81606c1bf?w=1920&q=80&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1482517967863-00e15c9b44be?w=1920&q=80&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1512389142860-9c449e58a543?w=1920&q=80&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1512909006721-3d6018887383?w=1920&q=80&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1483664852095-d6cc6870702d?w=1920&q=80&auto=format&fit=crop'
    ];

    let indiceFundoAtual = 0;
    const bgElement = document.getElementById('bg-slideshow');

    function trocarFundo() {
      const url = fundos[indiceFundoAtual];
      const img = new Image();
      img.src = url;
      img.onload = () => {
        bgElement.style.backgroundImage = `url('${url}')`;
        indiceFundoAtual = (indiceFundoAtual + 1) % fundos.length;
      };
    }
    trocarFundo();
    setInterval(trocarFundo, 10000);

    // ================= LÓGICA DA NEVE =================
    function createSnow() {
      const container = document.getElementById('snow-container');
      const snowflake = document.createElement('div');
      snowflake.classList.add('snowflake');
      const symbols = ['❅', '❆', '❄', '✧'];
      snowflake.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
      snowflake.style.left = Math.random() * 100 + 'vw';
      snowflake.style.fontSize = Math.random() * 15 + 10 + 'px';
      snowflake.style.opacity = Math.random() * 0.5 + 0.3;
      const duration = Math.random() * 5 + 3;
      snowflake.style.animationDuration = duration + 's';
      container.appendChild(snowflake);
      setTimeout(() => { snowflake.remove(); }, duration * 1000);
    }
    setInterval(createSnow, 200);

    // ================= LÓGICA DO SITE =================
    const CLOUDFLARE_WORKER_URL = "https://proxy-videos.claudineibu12.workers.dev/";

    const urlParams = new URLSearchParams(window.location.search);
    const nomeSerie = urlParams.get('nome');
    
    const videoModal = document.getElementById('videoModal');
    const playerContainer = document.getElementById('playerContainer');
    const modalTitulo = document.getElementById('modalTitulo');
    const linkOriginal = document.getElementById('linkOriginal');
    const capaSerieImg = document.getElementById('capaSerie');

    function isMobile() {
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
    }

    if (!nomeSerie) {
      document.getElementById('tituloSerie').innerText = "Série não encontrada";
      document.getElementById('conteudoEpisodios').innerHTML = '<div class="loading">Volte e escolha uma série.</div>';
    } else {
      document.getElementById('tituloSerie').innerText = nomeSerie;
      carregarEpisodios();
    }

    async function carregarEpisodios() {
      try {
        const resposta = await fetch('catalogo.json');
        const catalogo = await resposta.json();

        let epsDaSerie = catalogo.filter(item => item.serie.trim().toLowerCase() === nomeSerie.trim().toLowerCase());

        if (epsDaSerie.length === 0) {
          document.getElementById('conteudoEpisodios').innerHTML = '<div class="loading">Nenhum episódio encontrado.</div>';
          return;
        }

        const primeiraCapa = epsDaSerie[0].thumbnailUrl;
        if (primeiraCapa && primeiraCapa.trim() !== '') {
          capaSerieImg.src = primeiraCapa;
        } else {
          capaSerieImg.src = 'https://via.placeholder.com/800x400/1a1a2e/e63946?text=Sem+Capa';
        }

        epsDaSerie.sort((a, b) => a.temporada !== b.temporada ? a.temporada - b.temporada : a.episodio - b.episodio);

        const temporadas = {};
        epsDaSerie.forEach(ep => {
          if (!temporadas[ep.temporada]) temporadas[ep.temporada] = [];
          temporadas[ep.temporada].push(ep);
        });

        let htmlFinal = '';
        for (const numTemporada in temporadas) {
          htmlFinal += `<div class="temporada-bloco"><h2 class="temporada-titulo">${numTemporada}ª Temporada</h2><div class="lista-eps">`;

          temporadas[numTemporada].forEach(ep => {
            let tituloLimpo = ep.titulo.replace(nomeSerie, '').replace(/-\s*T\d+E\d+/i, '').replace(/T\d+E\d+/, '').trim();
            if(tituloLimpo.startsWith('-')) tituloLimpo = tituloLimpo.substring(1).trim();
            if(tituloLimpo === '') tituloLimpo = `Episódio ${ep.episodio}`;

            htmlFinal += `
              <a href="${ep.link}" class="ep-item" onclick="abrirPlayer(event, '${ep.videoUrl}', '${ep.titulo}', '${ep.link}')">
                <div class="ep-info">
                  <span class="ep-numero">E${ep.episodio.toString().padStart(2, '0')}</span>
                  <span class="ep-titulo">${tituloLimpo}</span>
                </div>
                <div class="ep-play">▶</div>
              </a>
            `;
          });
          htmlFinal += `</div></div>`;
        }
        document.getElementById('conteudoEpisodios').innerHTML = htmlFinal;

      } catch (erro) {
        document.getElementById('conteudoEpisodios').innerHTML = `<div class="loading">Erro ao carregar episódios.</div>`;
      }
    }

    window.abrirPlayer = function(event, videoUrl, titulo, linkHtml) {
      if (isMobile()) return; 

      event.preventDefault(); 
      
      if (!videoUrl || videoUrl.trim() === '') {
        alert("Link do vídeo não encontrado no catálogo. Abrindo página original.");
        window.location.href = linkHtml;
        return;
      }

      modalTitulo.innerText = titulo;
      linkOriginal.href = linkHtml;
      videoModal.style.display = 'flex';

      playerContainer.innerHTML = '<p style="color:#aaa;">Carregando vídeo...</p>';

      if (videoUrl.includes('youtube.com') || videoUrl.includes('youtu.be') || videoUrl.includes('embed') || videoUrl.includes('player')) {
        playerContainer.innerHTML = `<iframe src="${videoUrl}" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
      } else {
        let urlParaTocar = videoUrl;
        if (videoUrl.startsWith('http://')) {
           urlParaTocar = `${CLOUDFLARE_WORKER_URL}?url=${encodeURIComponent(videoUrl)}`;
        }
        
        playerContainer.innerHTML = `
          <video id="meuPlayer" controls playsinline autoplay preload="metadata" src="${urlParaTocar}">
            Seu navegador não suporta vídeo HTML5.
          </video>
        `;

        const videoElement = document.getElementById('meuPlayer');
        videoElement.addEventListener('error', function(e) {
          playerContainer.innerHTML = `
            <div class="erro-player">
              <h3>Vídeo indisponível 😕</h3>
              <p>O navegador bloqueou a conexão com o vídeo.</p>
              <a href="${linkHtml}" class="btn-erro">Abrir Página Original</a>
            </div>
          `;
        });
      }
    }

    window.fecharModal = function() {
      videoModal.style.display = 'none';
      playerContainer.innerHTML = ''; 
    }

    videoModal.addEventListener('click', function(e) {
      if (e.target === videoModal) fecharModal();
    });
  </script>
</body>
</html>
