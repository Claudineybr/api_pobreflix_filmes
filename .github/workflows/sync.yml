name: Sincronizar, Limpar e Padronizar

on:
  schedule:
    - cron: '0 */2 * * *' # Roda a cada 2 horas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Baixar, Filtrar e Padronizar Nomes
        run: |
          set -e
          T=$(mktemp -d)
          
          # 1. Clona a fonte original e o seu catálogo
          git clone --depth 1 https://github.com/WaveLy2308/api_pobreflix_filmes.git "$T/origem" || true
          git clone --depth 1 https://github.com/Claudineybr/catalogocompleto.git "$T/novos"
          
          # 2. Roda o script Python de filtragem e padronização
          cat > "$T/filtrar.py" << 'PYEOF'
          import re
          import shutil
          from pathlib import Path

          dir_origem = Path("ORIGEM_PATH") if Path("ORIGEM_PATH").exists() else None
          dir_novos = Path("NOVOS_PATH")
          dir_saida = Path("SAIDA_PATH")
          dir_saida.mkdir(parents=True, exist_ok=True)

          links_vistos = set()
          copiados = 0
          arquivos = []

          if dir_origem:
              arquivos.extend(list(dir_origem.glob("*.json")))
          arquivos.extend(list(dir_novos.glob("*.json")))

          # Prioriza os arquivos do repositório novo
          def prioridade(arq):
              is_novo = 1 if dir_novos in arq.parents else 0
              return (is_novo, len(arq.name))
          arquivos.sort(key=prioridade, reverse=True)

          for arq in arquivos:
              if any(x in arq.name for x in ['pendentes', 'fila', 'feitas', 'descartados', 'cache', 'renomeados', 'lista']): 
                  continue
                  
              try:
                  content = arq.read_text(encoding='utf-8-sig')
                  
                  # 1. Captura e limpa a URL para não ter duplicatas
                  match_url = re.search(r'"contentUrl"\s*:\s*"([^"]*)"', content)
                  url = match_url.group(1).strip() if match_url else ""
                  clean_url = url.split('?')[0].lower()
                  
                  if not url or url.endswith(".ts") or ".m3u8" in url: 
                      continue
                  if clean_url in links_vistos: 
                      continue
                  links_vistos.add(clean_url)

                  # 2. Pega o nome atual e limpa o lixo
                  match_name = re.search(r'"name"\s*:\s*"((?:[^"\\]|\\.)*)"', content)
                  nome_atual = match_name.group(1).replace('\\"', '"') if match_name else ""
                  
                  titulo = re.sub(r'[\(\)\[\]]', '', nome_atual)
                  titulo = re.sub(r'\b(19|20)\d{2}\b', '', titulo)
                  titulo = re.sub(r'(?i)-\s*T\d+E\d+.*', '', titulo)
                  titulo = re.sub(r'(?i)\bT\d+E\d+\b.*', '', titulo)
                  titulo = re.sub(r'(?i)Epis[oó]dio\s*\d+.*', '', titulo)
                  titulo = titulo.replace('🍿Clau', '').replace('🕸️ PK', '').replace('Marcos', '').replace('👾', '').strip()
                  titulo = re.sub(r'[-_]+', ' ', titulo)
                  titulo = re.sub(r'\s+', ' ', titulo).strip()
                  
                  # Deixa as primeiras letras maiúsculas
                  titulo = titulo.title()
                  if not titulo: titulo = "Sem Nome"

                  # 3. Verifica se é série (procura T1E1 no nome do arquivo ou no texto)
                  m_ep = re.search(r'(?i)t(\d+)e(\d+)', arq.name)
                  if not m_ep:
                      m_ep = re.search(r'(?i)t(\d+)e(\d+)', nome_atual)

                  if m_ep:
                      season = str(int(m_ep.group(1)))
                      episode = str(int(m_ep.group(2)))
                      ep_tag = f"T{season}E{episode}"
                      novo_nome_json = f"{titulo} {ep_tag}"  # Ex: O Atirador T2E1
                  else:
                      ep_tag = ""
                      novo_nome_json = titulo  # Ex: A Culpa é das Estrelas

                  # 4. Substitui as informações dentro do arquivo de forma segura (Regex)
                  # Escapa possíveis aspas do nome novo para não quebrar o JSON
                  safe_name = novo_nome_json.replace('"', '\\"')
                  
                  content = re.sub(r'("name"\s*:\s*")(?:[^"\\]|\\.)*(")', rf'\g<1>{safe_name}\g<2>', content)
                  content = re.sub(r'("description"\s*:\s*")(?:[^"\\]|\\.)*(")', rf'\g<1>Assista {safe_name}\g<2>', content)
                  content = re.sub(r'(<title>).*?(</title>)', rf'\g<1>{novo_nome_json}\g<2>', content, flags=re.DOTALL)
                  content = re.sub(r'(<h1>).*?(</h1>)', rf'\g<1>{novo_nome_json}\g<2>', content, flags=re.DOTALL)
                  content = content.replace("https://redetoons.cards", "https://redetoons.my")

                  # 5. Define o nome do arquivo físico (slug)
                  slug = re.sub(r'[^a-z0-9]', '_', titulo.lower())
                  slug = re.sub(r'_+', '_', slug).strip('_')
                  
                  if ep_tag:
                      novo_nome_arq = f"{slug}_{ep_tag.lower()}.json"
                  else:
                      novo_nome_arq = f"{slug}.json"

                  # Salva o arquivo na pasta de saída
                  (dir_saida / novo_nome_arq).write_text(content, encoding='utf-8')
                  copiados += 1
                  
              except Exception as e:
                  print(f"[ERRO] Falha em {arq.name}: {e}")
                  # TRAVA DE SEGURANÇA: Se der erro, copia o arquivo original para não ser deletado!
                  shutil.copy2(arq, dir_saida / arq.name)

          print(f"Total de arquivos processados e padronizados: {copiados}")
          PYEOF

          # Injeta os caminhos no script e roda
          sed -i "s|ORIGEM_PATH|$T/origem|g; s|NOVOS_PATH|$T/novos|g; s|SAIDA_PATH|$T/saida|g" "$T/filtrar.py"
          python3 -I "$T/filtrar.py"
          
          # 3. Substitui os arquivos na raiz do repositório
          find . -maxdepth 1 -name "*.json" -delete
          cp -f "$T"/saida/*.json .

      - name: Corrigir Defeitos (URLs e Aspas)
        run: |
          cat > fix_defects.py << 'PYEOF'
          import re
          from pathlib import Path

          def clean_url(url):
              if not url: return url
              url = url.strip()
              url = re.sub(r'<[^>]+>', '', url)
              match = re.search(r'(https?://[^\s"]+)', url)
              if match:
                  url = match.group(1)
              elif not url.startswith('http'):
                  url = 'http://' + url
              parts = url.split()
              if parts: url = parts[0]
              return url

          for filepath in Path('.').glob('*.json'):
              if any(x in filepath.name for x in ['pendentes', 'fila', 'feitas', 'descartados', 'cache']): continue
              try:
                  content = filepath.read_text(encoding='utf-8')
                  original = content
                  
                  # Conserta as URLs de forma segura
                  def repl_url(m):
                      return f'"{m.group(1)}": "{clean_url(m.group(2))}"'
                  content = re.sub(r'"(contentUrl|embedUrl)":\s*"([^"]*)"', repl_url, content)
                  
                  if content != original:
                      filepath.write_text(content, encoding='utf-8')
              except Exception: pass
          PYEOF
          python3 fix_defects.py

      - name: Salvar alterações
        run: |
          git config user.name "Claudineybr"
          git config user.email "Claudineybr@users.noreply.github.com"
          
          git add -A
          
          if git diff --cached --quiet; then
            echo "Sem mudancas."
            exit 0
          fi
          
          git commit -m "sync: padronizacao de nomes (Filmes: Nome / Series: Nome T1E1)"
          
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then
              echo "[SUCESSO] Push OK"
              exit 0
            fi
            echo "[FALHA] Conflito. Sincronizando..."
            git pull origin main --no-rebase -X ours --no-edit || true
            sleep $((RANDOM % 5 + 3))
          done
