name: Sincronizar, Limpar e Padronizar

on:
  schedule:
    - cron: '0 */6 * * *' # Roda a cada 6 horas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Baixar, Filtrar, Converter e Gerar Dashboard
        run: |
          set -e
          T=$(mktemp -d)
          
          # 1. Clona a fonte original e o seu catálogo
          git clone --depth 1 https://github.com/WaveLy2308/api_pobreflix_filmes.git "$T/origem" || true
          git clone --depth 1 https://github.com/Claudineybr/catalogocompleto.git "$T/novos"
          
          # 2. Roda o script Python
          cat > "$T/filtrar.py" << 'PYEOF'
          import re
          import shutil
          import unicodedata
          import json
          from pathlib import Path

          dir_origem = Path("ORIGEM_PATH") if Path("ORIGEM_PATH").exists() else None
          dir_novos = Path("NOVOS_PATH")
          dir_saida = Path("SAIDA_PATH")
          dir_saida.mkdir(parents=True, exist_ok=True)

          links_vistos = set() # <--- CONTROLE DE DUPLICADOS AQUI
          copiados = 0
          arquivos = []
          urls_quebradas = []
          catalogo = []

          if dir_origem:
              arquivos.extend(list(dir_origem.glob("*.json")))
              arquivos.extend(list(dir_origem.glob("*.html")))
          arquivos.extend(list(dir_novos.glob("*.json")))
          arquivos.extend(list(dir_novos.glob("*.html")))

          def prioridade(arq):
              is_novo = 1 if dir_novos in arq.parents else 0
              return (is_novo, len(arq.name))
          arquivos.sort(key=prioridade, reverse=True)

          def extract_episode(text):
              if not text: return ""
              m = re.search(r'(?i)t\s*(\d+)\s*[._-]?\s*(?:e|ep|epis[oó]dio)\s*[._-]?\s*(\d+)', text)
              if m: return f"T{int(m.group(1))}E{int(m.group(2))}"
              m = re.search(r'\b(\d{1,2})x(\d{1,3})\b', text)
              if m: return f"T{int(m.group(1))}E{int(m.group(2))}"
              return ""

          def limpar_titulo(raw_text):
              if not raw_text: return "Desconhecido"
              texto_norm = unicodedata.normalize('NFKD', str(raw_text))
              texto_norm = "".join([c for c in texto_norm if not unicodedata.combining(c)])
              
              for lixo in ['🍿Clau', '🕸️ PK', '🕸️', 'PK', '👾', 'Marcos', 'Clau', 'clau']:
                  texto_norm = texto_norm.replace(lixo, '')
                  
              texto_norm = re.sub(r'(?i)t\s*\d+\s*[._-]?\s*(?:e|ep|epis[oó]dio)\s*[._-]?\s*\d+', '', texto_norm)
              texto_norm = re.sub(r'\b\d{1,2}x\d{1,3}\b', '', texto_norm)
              texto_norm = texto_norm.replace('_', ' ')
              
              partes = [p.strip() for p in re.split(r'\s+[-–—]\s+', texto_norm) if p.strip()]
              partes_limpas = [p for p in partes if not any(pref in p.lower() for pref in ['vini', 'marcos', 'inix', 'lili', 'estrelinha', 'grave', 'site', 'online', 'blogspot', 'assistir', 'download'])]
              
              titulo_base = partes_limpas[0] if partes_limpas else "Desconhecido"
              titulo_base = re.sub(r'\b(19\d{2}|20\d{2})\b', '', titulo_base).strip()
              return re.sub(r'[\s.:;,]+$', '', titulo_base).strip()

          def clean_url(url):
              if not url: return ""
              url = url.strip()
              url = re.sub(r'<[^>]+>', '', url)
              match = re.search(r'(https?://[^\s"]+)', url)
              if match: url = match.group(1)
              elif not url.startswith('http'): url = 'http://' + url
              return url.split()[0] if url.split() else ""

          for arq in arquivos:
              if any(x in arq.name for x in ['pendentes', 'fila', 'feitas', 'descartados', 'cache', 'renomeados', 'lista', 'catalog', 'index']): 
                  continue
                  
              try:
                  content = arq.read_text(encoding='utf-8-sig')
                  
                  url_match = re.search(r'"(?:contentUrl|embedUrl)"\s*:\s*"([^"]*)"', content)
                  url = url_match.group(1) if url_match else ""
                  nova_url = clean_url(url)
                  
                  if not nova_url:
                      urls_quebradas.append(arq.name)
                      nova_url = url if url else "http://quebrado.com/video.mp4"

                  # CHECAGEM DE DUPLICADO: Só ignora se o link for EXATAMENTE o mesmo
                  clean_url_lower = nova_url.split('?')[0].lower()
                  if clean_url_lower in links_vistos: 
                      continue # Pula esse arquivo, pois é duplicado
                  links_vistos.add(clean_url_lower)

                  capa_url = "https://via.placeholder.com/500x750?text=Sem+Capa"
                  match_capa = re.search(r'"thumbnailUrl"\s*:\s*\[\s*"([^"]+)"', content)
                  if match_capa: capa_url = match_capa.group(1)

                  match_name = re.search(r'"name"\s*:\s*"([^"]*)"', content)
                  nome_atual = match_name.group(1) if match_name else arq.name.replace('.json', '').replace('.html', '')
                  if len(nome_atual) < 5: nome_atual = arq.name.replace('.json', '').replace('.html', '')

                  ep_tag = extract_episode(nome_atual) or extract_episode(arq.name) or extract_episode(nova_url)

                  titulo_limpo = limpar_titulo(nome_atual)
                  match_ano = re.search(r'\b(19\d{2}|20\d{2})\b', nome_atual)
                  ano = match_ano.group(1) if match_ano else ""

                  if ep_tag:
                      novo_nome_json = f"{titulo_limpo} - {ep_tag} - 🍿Clau"
                  else:
                      novo_nome_json = f"{titulo_limpo} ({ano}) - 🍿Clau" if ano else f"{titulo_limpo} - 🍿Clau"

                  slug = re.sub(r'[^a-z0-9]', '_', titulo_limpo.lower())
                  slug = re.sub(r'_+', '_', slug).strip('_')
                  
                  if ep_tag:
                      novo_nome_arq = f"{slug}_{ep_tag.lower()}.html"
                  else:
                      novo_nome_arq = f"{slug}_{ano}.html" if ano else f"{slug}.html"

                  base_url = "https://api-pobreflix-filmes.pages.dev"
                  url_unica = f"{base_url}/{novo_nome_arq}"

                  novo_json = {
                      "@context": "https://schema.org", "@type": "VideoObject",
                      "@id": url_unica, 
                      "url": url_unica, 
                      "name": novo_nome_json,
                      "description": f"Assista {novo_nome_json}",
                      "thumbnailUrl": [capa_url],
                      "uploadDate": "2020-01-01T00:00:00+00:00", "inLanguage": "pt",
                      "contentUrl": nova_url, "embedUrl": nova_url
                  }
                  
                  catalogo.append({"name": novo_nome_json, "file": novo_nome_arq})
                  
                  json_str = json.dumps(novo_json, ensure_ascii=False, indent=2)
                  html_lines = [
                      "<!DOCTYPE html>",
                      "<html lang=\"pt-BR\">",
                      "<head>",
                      "    <meta charset=\"UTF-8\">",
                      "    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">",
                      "    <script type=\"application/ld+json\">",
                      json_str,
                      "    </script>",
                      f"    <title>{novo_nome_json}</title>",
                      "    <style>",
                      "        body, html { margin: 0; padding: 0; background-color: #000; height: 100%; width: 100%; overflow: hidden; }",
                      "        video { width: 100%; height: 100%; outline: none; }",
                      "    </style>",
                      "</head>",
                      "<body>",
                      f"    <video src=\"{nova_url}\" poster=\"{capa_url}\" controls autoplay playsinline></video>",
                      "</body>",
                      "</html>"
                  ]
                  novo_html = "\n".join(html_lines)

                  (dir_saida / novo_nome_arq).write_text(novo_html, encoding='utf-8')
                  copiados += 1
                  
              except Exception as e:
                  print(f"Erro: {e}")

          # SALVA O CATALOG.JSON PARA A BUSCA
          catalogo = sorted(catalogo, key=lambda x: x['name'].lower())
          (dir_saida / "catalog.json").write_text(json.dumps(catalogo, ensure_ascii=False, indent=2), encoding="utf-8")

          # GERA O INDEX.HTML NOVAMENTE
          index_html = '''<!DOCTYPE html>
          <html lang="pt-BR">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Busca - Rave</title>
              <style>
                  * { box-sizing: border-box; }
                  body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #0f0f13; color: #fff; padding: 20px; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
                  .header { text-align: center; margin-top: 10vh; margin-bottom: 30px; transition: 0.3s; }
                  .header.searching { margin-top: 5vh; }
                  h1 { color: #e50914; font-size: 2.5rem; margin: 0; display: flex; align-items: center; justify-content: center; gap: 10px; }
                  h1 span { font-size: 2rem; }
                  .search-container { width: 100%; max-width: 650px; position: relative; margin-bottom: 40px; }
                  input { width: 100%; padding: 18px 24px; font-size: 18px; border-radius: 50px; border: 1px solid #333; background: #1c1c24; color: #fff; outline: none; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
                  input:focus { border-color: #e50914; box-shadow: 0 0 20px rgba(229, 9, 20, 0.2); background: #22222b; }
                  .welcome-screen { text-align: center; color: #666; display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 50px; animation: fadeIn 0.5s ease; }
                  .welcome-screen svg { width: 60px; height: 60px; opacity: 0.5; }
                  #resultados { width: 100%; max-width: 650px; display: flex; flex-direction: column; gap: 12px; display: none; }
                  a { color: #fff; text-decoration: none; background: #1c1c24; padding: 18px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; border-left: 4px solid transparent; animation: slideUp 0.3s ease; }
                  a:hover { background: #22222b; border-left-color: #e50914; transform: translateX(5px); }
                  .item-name { font-weight: 500; font-size: 16px; }
                  .item-icon { color: #555; transition: 0.2s; }
                  a:hover .item-icon { color: #e50914; }
                  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
                  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
              </style>
          </head>
          <body>
              <div class="header" id="header">
                  <h1><span>🍿</span> Rave Search</h1>
              </div>
              <div class="search-container">
                  <input type="text" id="pesquisa" placeholder="Pesquise por um filme ou série..." autocomplete="off">
              </div>
              <div class="welcome-screen" id="welcome-screen">
                  <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"></path></svg>
                  <p>Digite para encontrar seu próximo filme.</p>
              </div>
              <div id="resultados"></div>
              <script>
                  let catalogoCompleto = [];
                  const inputElement = document.getElementById('pesquisa');
                  const containerResultados = document.getElementById('resultados');
                  const welcomeScreen = document.getElementById('welcome-screen');
                  const headerElement = document.getElementById('header');

                  fetch('catalog.json')
                      .then(response => response.json())
                      .then(data => { catalogoCompleto = data; })
                      .catch(err => console.error("Erro ao carregar catálogo:", err));

                  inputElement.addEventListener('input', (e) => {
                      const termo = e.target.value.toLowerCase().trim();
                      if (termo.length === 0) {
                          containerResultados.style.display = 'none';
                          welcomeScreen.style.display = 'flex';
                          headerElement.classList.remove('searching');
                          return;
                      }
                      welcomeScreen.style.display = 'none';
                      containerResultados.style.display = 'flex';
                      headerElement.classList.add('searching');
                      if (termo.length < 2) { containerResultados.innerHTML = ''; return; }

                      const filtrados = catalogoCompleto.filter(item => item.name.toLowerCase().includes(termo));
                      exibirResultados(filtrados.slice(0, 50));
                  });

                  function exibirResultados(itens) {
                      containerResultados.innerHTML = '';
                      if (itens.length === 0) {
                          containerResultados.innerHTML = '<div style="text-align:center; color:#666; margin-top:20px;">Nenhum resultado encontrado.</div>';
                          return;
                      }
                      itens.forEach(item => {
                          const a = document.createElement('a');
                          a.href = item.file;
                          a.target = "_blank";
                          const nameSpan = document.createElement('span');
                          nameSpan.className = 'item-name';
                          nameSpan.textContent = item.name;
                          const iconSpan = document.createElement('span');
                          iconSpan.className = 'item-icon';
                          iconSpan.textContent = '▶';
                          a.appendChild(nameSpan);
                          a.appendChild(iconSpan);
                          containerResultados.appendChild(a);
                      });
                  }
              </script>
          </body>
          </html>'''
          (dir_saida / "index.html").write_text(index_html, encoding='utf-8')

          if urls_quebradas:
              (dir_saida / "urls_invalidas.txt").write_text("\n".join(urls_quebradas), encoding="utf-8")
              
          print(f"Total de arquivos HTML processados: {copiados}")
          print(f"Catalog.json gerado com {len(catalogo)} itens.")
          PYEOF

          sed -i "s|ORIGEM_PATH|$T/origem|g; s|NOVOS_PATH|$T/novos|g; s|SAIDA_PATH|$T/saida|g" "$T/filtrar.py"
          python3 -I "$T/filtrar.py"
          
          # SEGURANÇA NA LIMPEZA: Não apaga o index.html e nem o catalog.json
          find . -maxdepth 1 -name "*.json" ! -name "catalog.json" -delete
          find . -maxdepth 1 -name "*.html" ! -name "index.html" -delete
          
          # COPIA OS NOVOS ARQUIVOS
          cp -f "$T"/saida/*.html .
          cp -f "$T"/saida/*.json .
          if [ -f "$T/saida/urls_invalidas.txt" ]; then cp -f "$T/saida/urls_invalidas.txt" .; fi

      - name: Salvar alterações
        run: |
          git config user.name "Claudineybr"
          git config user.email "Claudineybr@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "sync: remove duplicatas por link, protege dashboard e adiciona @id"
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then exit 0; fi
            git pull origin main --no-rebase -X ours --no-edit || true
            sleep 3
          done
