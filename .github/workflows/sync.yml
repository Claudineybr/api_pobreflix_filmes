name: Sincronizar, Limpar e Padronizar

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Baixar, Filtrar, Converter e Gerar Dashboard
        run: |
          set -e
          T=$(mktemp -d)
          
          git clone --depth 1 https://github.com/WaveLy2308/api_pobreflix_filmes.git "$T/origem" || true
          git clone --depth 1 https://github.com/Claudineybr/catalogocompleto.git "$T/novos"
          
          cat > "$T/filtrar.py" << 'PYEOF'
          import re
          import shutil
          import unicodedata
          import json
          from pathlib import Path

          dir_origem = Path("ORIGEM_PATH") if Path("ORIGEM_PATH").exists() else None
          dir_novos = Path("NOVOS_PATH")
          dir_saida = Path("SAIDA_PATH")
          dir_saida.mkdir(parents=True, exist_ok=True)

          links_vistos = set()
          copiados = 0
          arquivos = []
          urls_quebradas = []
          catalogo = []

          if dir_origem:
              arquivos.extend(list(dir_origem.glob("*.json")))
          arquivos.extend(list(dir_novos.glob("*.json")))

          def prioridade(arq):
              is_novo = 1 if dir_novos in arq.parents else 0
              return (is_novo, len(arq.name))
          arquivos.sort(key=prioridade, reverse=True)

          def clean_url(url):
              if not url: return ""
              url = url.strip()
              url = re.sub(r'<[^>]+>', '', url)
              match = re.search(r'(https?://[^\s"]+)', url)
              if match: url = match.group(1)
              elif not url.startswith('http'): url = 'http://' + url
              return url.split()[0] if url.split() else ""

          def limpar_nome_exibicao(nome):
              nome_norm = unicodedata.normalize('NFKD', str(nome))
              nome_norm = "".join([c for c in nome_norm if not unicodedata.combining(c)])
              for lixo in ['🍿Clau', '🕸️ PK', '🕸️', 'PK', '👾', 'Marcos', 'Marcosx7', 'Clau', 'clau', 'ViNi7x', 'Vini7x', 'ViNi', 'Vini']:
                  nome_norm = re.sub(re.escape(lixo), '', nome_norm, flags=re.I)
              nome_norm = re.sub(r'\b(19|20)\d{2}\b', '', nome_norm)
              nome_norm = re.sub(r'\(\s*\)', '', nome_norm)
              nome_norm = re.sub(r'\s*-\s*-\s*', ' - ', nome_norm)
              nome_norm = re.sub(r'\s+', ' ', nome_norm)
              return nome_norm.strip(' - ')

          for arq in arquivos:
              if any(x in arq.name for x in ['pendentes', 'fila', 'feitas', 'descartados', 'cache', 'renomeados', 'lista', 'catalog', 'index']): 
                  continue
                  
              try:
                  content = arq.read_text(encoding='utf-8-sig')
                  
                  url_match = re.search(r'"(?:contentUrl|embedUrl)"\s*:\s*"([^"]*)"', content)
                  url = url_match.group(1) if url_match else ""
                  nova_url = clean_url(url)
                  
                  if not nova_url:
                      urls_quebradas.append(arq.name)
                      continue

                  clean_url_lower = nova_url.split('?')[0].lower()
                  if clean_url_lower in links_vistos: 
                      continue 
                  links_vistos.add(clean_url_lower)

                  capa_url = "https://via.placeholder.com/500x750?text=Sem+Capa"
                  match_capa = re.search(r'"thumbnailUrl"\s*:\s*\[\s*"([^"]+)"', content)
                  if match_capa: capa_url = match_capa.group(1)

                  match_name = re.search(r'"name"\s*:\s*"([^"]*)"', content)
                  nome_exato = match_name.group(1) if match_name else arq.stem
                  
                  nome_limpo = limpar_nome_exibicao(nome_exato)
                  nome_final_json = f"{nome_limpo} - 🍿Clau"

                  slug_base = re.sub(r'[^a-z0-9]', '_', nome_limpo.lower())
                  slug_base = re.sub(r'_+', '_', slug_base).strip('_')
                  
                  m_tag = re.search(r'\bT(\d+)E(\d+)\b', nome_limpo, re.I)
                  if m_tag:
                      slug_base += f"_t{int(m_tag.group(1))}e{int(m_tag.group(2))}"
                  
                  if not slug_base:
                      slug_base = arq.stem.lower()

                  novo_nome_arq = f"{slug_base}.html"
                  base_url = "https://api-pobreflix-filmes.pages.dev"
                  url_unica = f"{base_url}/{novo_nome_arq}"

                  novo_json = {
                      "@context": "https://schema.org", "@type": "VideoObject",
                      "@id": url_unica, "url": url_unica, "name": nome_final_json,
                      "description": f"Assista {nome_final_json}", "thumbnailUrl": [capa_url],
                      "uploadDate": "2020-01-01T00:00:00+00:00", "inLanguage": "pt",
                      "contentUrl": nova_url, "embedUrl": nova_url
                  }
                  
                  catalogo.append({"name": nome_final_json, "file": novo_nome_arq})
                  
                  json_str = json.dumps(novo_json, ensure_ascii=False, indent=2)
                  html_lines = [
                      "<!DOCTYPE html>",
                      "<html lang=\"pt-BR\">",
                      "<head>",
                      "    <meta charset=\"UTF-8\">",
                      "    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">",
                      "    <link rel=\"icon\" href=\"data:,\">", # <--- LINHA DO FAVICON AQUI
                      "    <script type=\"application/ld+json\">",
                      json_str,
                      "    </script>",
                      f"    <title>{nome_final_json}</title>",
                      "    <style>",
                      "        body, html { margin: 0; padding: 0; background-color: #000; height: 100%; width: 100%; overflow: hidden; }",
                      "        video { width: 100%; height: 100%; outline: none; }",
                      "    </style>",
                      "</head>",
                      "<body>",
                      f"    <video src=\"{nova_url}\" poster=\"{capa_url}\" controls autoplay playsinline></video>",
                      "</body>",
                      "</html>"
                  ]
                  novo_html = "\n".join(html_lines)

                  (dir_saida / novo_nome_arq).write_text(novo_html, encoding='utf-8')
                  copiados += 1
                  
              except Exception as e:
                  print(f"Erro ao processar {arq.name}: {e}")

          def ordenar_por_serie_e_episodio(item):
              nome = item['name']
              match = re.search(r'\bT(\d+)E(\d+)\b', nome, re.I)
              base_name = re.split(r'\s*-\s*T\d+E\d+', nome, flags=re.I)[0].strip().lower()
              base_name = re.sub(r'[\(\)\[\]\-]', '', base_name).strip()
              if match: return (base_name, int(match.group(1)), int(match.group(2)))
              return (base_name, 0, 0)

          catalogo = sorted(catalogo, key=ordenar_por_serie_e_episodio)
          (dir_saida / "catalog.json").write_text(json.dumps(catalogo, ensure_ascii=False, indent=2), encoding="utf-8")

          index_html = '''<!DOCTYPE html>
          <html lang="pt-BR">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <link rel="icon" href="data:,"> <!-- LINHA DO FAVICON AQUI -->
              <title>Busca - Rave</title>
              <style>
                  /* ... (Seus estilos CSS continuam aqui) ... */
                  * { box-sizing: border-box; }
                  body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: #0f0f13; color: #fff; padding: 20px; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
                  .header { text-align: center; margin-top: 10vh; margin-bottom: 30px; transition: 0.3s; }
                  .header.searching { margin-top: 5vh; }
                  h1 { color: #e50914; font-size: 2.5rem; margin: 0; display: flex; align-items: center; justify-content: center; gap: 10px; }
                  .search-container { width: 100%; max-width: 650px; position: relative; margin-bottom: 40px; }
                  input { width: 100%; padding: 18px 24px; font-size: 18px; border-radius: 50px; border: 1px solid #333; background: #1c1c24; color: #fff; outline: none; transition: 0.3s; }
                  input:focus { border-color: #e50914; box-shadow: 0 0 20px rgba(229, 9, 20, 0.2); }
                  .welcome-screen { text-align: center; color: #666; display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 50px; }
                  #resultados { width: 100%; max-width: 650px; display: flex; flex-direction: column; gap: 12px; display: none; }
                  a { color: #fff; text-decoration: none; background: #1c1c24; padding: 18px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; border-left: 4px solid transparent; }
                  a:hover { background: #22222b; border-left-color: #e50914; transform: translateX(5px); }
                  .item-icon { color: #555; }
                  a:hover .item-icon { color: #e50914; }
              </style>
          </head>
          <body>
              <div class="header" id="header"><h1><span>🍿</span> Rave Search</h1></div>
              <div class="search-container">
                  <input type="text" id="pesquisa" placeholder="Pesquise por um filme ou série..." autocomplete="off">
              </div>
              <div class="welcome-screen" id="welcome-screen">
                  <p>Digite para encontrar seu próximo filme.</p>
              </div>
              <div id="resultados"></div>
              <script>
                  let catalogoCompleto = [];
                  const inputElement = document.getElementById('pesquisa');
                  const containerResultados = document.getElementById('resultados');
                  const welcomeScreen = document.getElementById('welcome-screen');
                  const headerElement = document.getElementById('header');

                  fetch('catalog.json?v=' + new Date().getTime())
                      .then(r => r.json()).then(data => catalogoCompleto = data)
                      .catch(err => console.error(err));

                  function limparVisual(nome) {
                      let n = nome.normalize('NFKC');
                      n = n.replace(/(🍿clau|🍿|clau|🕸️\\s*pk|🕸️|pk|👾|marcos|vini7x|vini)/gi, '');
                      n = n.replace(/\\b(19|20)\\d{2}\\b/g, '');
                      n = n.replace(/\\(\\s*\\)/g, '');
                      n = n.replace(/\\s*-\\s*-\\s*/g, ' - ');
                      return n.replace(/\\s+/g, ' ').trim().replace(/^[-]+|[-]+$/g, '');
                  }

                  inputElement.addEventListener('input', (e) => {
                      const termo = e.target.value.toLowerCase().trim();
                      if (termo.length === 0) {
                          containerResultados.style.display = 'none';
                          welcomeScreen.style.display = 'flex';
                          headerElement.classList.remove('searching');
                          return;
                      }
                      welcomeScreen.style.display = 'none';
                      containerResultados.style.display = 'flex';
                      headerElement.classList.add('searching');
                      if (termo.length < 2) { containerResultados.innerHTML = ''; return; }

                      let filtrados = catalogoCompleto.filter(item => limparVisual(item.name).toLowerCase().includes(termo));
                      
                      filtrados.sort((a, b) => {
                          const name_a = limparVisual(a.name), name_b = limparVisual(b.name);
                          const m_a = name_a.match(/T(\\d+)E(\\d+)/i), m_b = name_b.match(/T(\\d+)E(\\d+)/i);
                          const base_a = name_a.split(/ - T\\d+E\\d+/i)[0].replace(/[\\(\\)\\[\\]\\-]/g, '').trim().toLowerCase();
                          const base_b = name_b.split(/ - T\\d+E\\d+/i)[0].replace(/[\\(\\)\\[\\]\\-]/g, '').trim().toLowerCase();
                          if (base_a < base_b) return -1;
                          if (base_a > base_b) return 1;
                          if (m_a && m_b) {
                              const s_a = parseInt(m_a[1], 10), s_b = parseInt(m_b[1], 10);
                              if (s_a !== s_b) return s_a - s_b;
                              const e_a = parseInt(m_a[2], 10), e_b = parseInt(m_b[2], 10);
                              return e_a - e_b;
                          }
                          return 0;
                      });
                      exibirResultados(filtrados.slice(0, 100));
                  });

                  function exibirResultados(itens) {
                      containerResultados.innerHTML = '';
                      if (itens.length === 0) { containerResultados.innerHTML = '<div style="text-align:center; color:#666;">Nenhum resultado encontrado.</div>'; return; }
                      itens.forEach(item => {
                          const a = document.createElement('a');
                          a.href = item.file; a.target = "_blank";
                          a.innerHTML = `<span class="item-name">${limparVisual(item.name)} - 🍿Clau</span><span class="item-icon">▶</span>`;
                          containerResultados.appendChild(a);
                      });
                  }
              </script>
          </body>
          </html>'''
          (dir_saida / "index.html").write_text(index_html, encoding='utf-8')

          if urls_quebradas:
              (dir_saida / "urls_invalidas.txt").write_text("\n".join(urls_quebradas), encoding="utf-8")
          PYEOF

          sed -i "s|ORIGEM_PATH|$T/origem|g; s|NOVOS_PATH|$T/novos|g; s|SAIDA_PATH|$T/saida|g" "$T/filtrar.py"
          python3 -I "$T/filtrar.py"
          
          find . -maxdepth 1 -name "*.json" ! -name "catalog.json" -delete
          find . -maxdepth 1 -name "*.html" ! -name "index.html" -delete
          
          cp -f "$T"/saida/*.html .
          cp -f "$T"/saida/*.json .
          if [ -f "$T/saida/urls_invalidas.txt" ]; then cp -f "$T/saida/urls_invalidas.txt" .; fi

      - name: Salvar alterações
        run: |
          git config user.name "Claudineybr"
          git config user.email "Claudineybr@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "sync: bloquear favicon e normalizar caracteres"
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then exit 0; fi
            git pull origin main --no-rebase -X ours --no-edit || true
            sleep 3
          done
