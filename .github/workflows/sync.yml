name: Sincronizar, Limpar e Padronizar

on:
  schedule:
    - cron: '0 */12 * * *' # Roda de 12 em 12 horas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar dependencias Python
        run: |
          pip install beautifulsoup4

      - name: Baixar, Filtrar e Padronizar Nomes
        run: |
          set -e
          T=$(mktemp -d)
          
          # 1. Clona a fonte original e o seu catálogo
          git clone --depth 1 https://github.com/WaveLy2308/api_pobreflix_filmes.git "$T/origem" || true
          git clone --depth 1 https://github.com/Claudineybr/catalogocompleto.git "$T/novos"
          
          # 2. Roda o script Python de filtragem, padronização e reconstrução
          cat > "$T/filtrar.py" << 'PYEOF'
          import re
          import shutil
          import unicodedata
          import json
          import textwrap
          from pathlib import Path
          from bs4 import BeautifulSoup

          dir_origem = Path("ORIGEM_PATH") if Path("ORIGEM_PATH").exists() else None
          dir_novos = Path("NOVOS_PATH")
          dir_saida = Path("SAIDA_PATH")
          dir_saida.mkdir(parents=True, exist_ok=True)

          links_vistos = set()
          copiados = 0
          arquivos = []
          urls_quebradas = []

          if dir_origem:
              arquivos.extend(list(dir_origem.glob("*.json")))
              arquivos.extend(list(dir_origem.glob("*.html")))
          arquivos.extend(list(dir_novos.glob("*.json")))
          arquivos.extend(list(dir_novos.glob("*.html")))

          def prioridade(arq):
              is_novo = 1 if dir_novos in arq.parents else 0
              return (is_novo, len(arq.name))
          arquivos.sort(key=prioridade, reverse=True)

          def limpar_titulo(raw_text):
              if not raw_text: return "Desconhecido"
              texto_norm = unicodedata.normalize('NFKD', str(raw_text))
              texto_norm = "".join([c for c in texto_norm if not unicodedata.combining(c)])
              
              for lixo in ['🍿Clau', '🕸️ PK', '🕸️', 'PK', '👾', 'Marcos', 'Clau', 'clau']:
                  texto_norm = texto_norm.replace(lixo, '')
                  
              texto_norm = re.sub(r'(?i)\bT\d+E\d+\b', '', texto_norm)
              texto_norm = re.sub(r'(?i)_t\d+e\d+', '', texto_norm)
              texto_norm = re.sub(r'(?i)Epis[oó]dio\s*\d+', '', texto_norm)
              
              partes = [p.strip() for p in re.split(r'\s+[-–—]\s+', texto_norm) if p.strip()]
              partes_limpas = []
              
              for p in partes:
                  p_lower = p.lower()
                  if any(pref in p_lower for pref in ['vini', 'marcos', 'inix', 'lili', 'estrelinha', 'grave', 'site', 'online', 'blogspot', 'assistir', 'download']):
                      continue
                  p_limpo = re.sub(r'(?i)\bT\d+E\d+\b', '', p).strip()
                  if p_limpo:
                      partes_limpas.append(p_limpo)
                      
              titulo_final = ' - '.join(partes_limpas) if partes_limpas else partes[0] if partes else "Desconhecido"
              titulo_final = re.sub(r'\s*\(?\d{4}\)?\s*$', '', titulo_final).strip()
              titulo_final = re.sub(r'\s*\(\d+\)$', '', titulo_final).strip()
              titulo_final = re.sub(r'[\s.:;,]+$', '', titulo_final).strip()
              
              return titulo_final if titulo_final else "Desconhecido"

          def clean_url(url):
              if not url: return ""
              url = url.strip()
              url = re.sub(r'<[^>]+>', '', url)
              match = re.search(r'(https?://[^\s"]+)', url)
              if match: url = match.group(1)
              elif not url.startswith('http'): url = 'http://' + url
              return url.split()[0] if url.split() else ""

          # --- TEMPLATE EXATO DO CARD VISUAL ---
          template_base = textwrap.dedent("""
              <!-- 1. METADADOS -->
              <script type="application/ld+json">
              __JSON__
              </script>

              <h1 class="post-title" style="margin-bottom: 20px;">__NOME__</h1>

              <!-- 2. O CARD VISUAL -->
              <div class="meu-card-player" style="background: linear-gradient(145deg,#0b0b12,#161625); border-radius:20px; overflow:hidden; box-shadow:0 25px 60px rgba(0,0,0,.8); margin:25px 0; border:1px solid rgba(255,255,255,.06);">
                
                <div class="capa-filme" id="capa-__ID__" style="cursor: pointer; position: relative;">
                  <img src="__CAPA__" style="width:100%; display:block;">
                  
                  <div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); width:70px; height:70px; background:linear-gradient(135deg,#7a00ff,#c000ff); border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 0 20px rgba(120,0,255,.6); color:white; font-size:26px; border:2px solid rgba(255,255,255,.2);">▶</div>
                  
                  <div style="position:absolute; top:12px; right:12px; background:#ff003c; padding:6px 12px; border-radius:20px; font-size:11px; color:#fff; font-weight:bold;">HD</div>
                </div>

                <!-- 3. O PLAYER REAL -->
                <div id="container-video-__ID__" style="display: none;">
              __PLAYER__
                </div>

                <!-- CONTEÚDO DO CARD -->
                <div class="conteudo-card" style="padding: 18px;">
                  <div style="color: #ffd54f; font-weight: bold; font-size: 18px; margin-bottom: 10px;">⭐ NOTA __NOTA__ <span style="color: #aaa; font-size: 12px;">/10</span></div>
                  <p style="font-size: 14px; color: #cfcfcf; line-height: 1.6; margin-bottom: 14px;">__SINOPSE__</p>
                </div>
              </div>

              <!-- 4. SCRIPT DE TROCA -->
              <script>
                document.addEventListener("DOMContentLoaded", function() {
                  const capa = document.getElementById('capa-__ID__');
                  const containerVideo = document.getElementById('container-video-__ID__');
              __SCRIPT_PLAYER__

                  capa.addEventListener('click', function() {
                    capa.style.display = 'none';
                    containerVideo.style.display = 'block';
                    if (typeof video !== 'undefined' && video !== null) {
                        video.play().catch(function(error) {
                          console.log("Autoplay bloqueado.");
                        });
                    }
                  });
                });
              </script>
          """).strip()

          for arq in arquivos:
              if any(x in arq.name for x in ['pendentes', 'fila', 'feitas', 'descartados', 'cache', 'renomeados', 'lista', 'index']): 
                  continue
                  
              try:
                  content = arq.read_text(encoding='utf-8-sig')
                  soup_old = BeautifulSoup(content, 'html.parser')
                  
                  url_match = re.search(r'"(?:contentUrl|embedUrl)"\s*:\s*"([^"]*)"', content)
                  url = url_match.group(1) if url_match else ""
                  nova_url = clean_url(url)
                  
                  if not nova_url:
                      urls_quebradas.append(arq.name)
                      nova_url = url if url else "http://quebrado.com/video.mp4"

                  clean_url_lower = nova_url.split('?')[0].lower()
                  if clean_url_lower in links_vistos: 
                      continue
                  links_vistos.add(clean_url_lower)

                  match_name = re.search(r'"name"\s*:\s*"([^"]*)"', content)
                  nome_atual = match_name.group(1) if match_name else arq.name.replace('.json', '').replace('.html', '')
                  if len(nome_atual) < 5:
                      nome_atual = arq.name.replace('.json', '').replace('.html', '')
                      
                  match_ano = re.search(r'\b(19\d{2}|20\d{2})\b', nome_atual)
                  ano = match_ano.group(1) if match_ano else ""
                  
                  thumb_match = re.search(r'"thumbnailUrl"\s*:\s*\[\s*"([^"]*)"', content)
                  thumb_atual = thumb_match.group(1) if thumb_match else "https://via.placeholder.com/500x750?text=Sem+Capa"

                  sinopse = "Sinopse não disponível."
                  texto_corpo = soup_old.get_text(separator=' ', strip=True)
                  match_sinopse = re.search(r'(?:Sinopse|SINOPSE)\s*(.*?)(?:Nota|NOTA|$)', texto_corpo, re.DOTALL | re.IGNORECASE)
                  if match_sinopse and len(match_sinopse.group(1)) > 20:
                      sinopse = match_sinopse.group(1).strip()[:300] + "..."
                  
                  nota = "8.5"
                  match_nota = re.search(r'(?:Nota|NOTA)\s*(\d+\.?\d*)', texto_corpo, re.IGNORECASE)
                  if match_nota:
                      nota = match_nota.group(1)

                  titulo_limpo = limpar_titulo(nome_atual)
                  
                  m_ep = re.search(r'(?i)_t(\d+)e(\d+)', arq.name)
                  if not m_ep: m_ep = re.search(r'(?i)t(\d+)e(\d+)', nome_atual)
                  
                  if m_ep:
                      ep_tag = f"T{int(m_ep.group(1))}E{int(m_ep.group(2))}"
                      novo_nome_json = f"{titulo_limpo} {ep_tag} - 🍿Clau"
                  else:
                      ep_tag = ""
                      novo_nome_json = f"{titulo_limpo} ({ano}) - 🍿Clau" if ano else f"{titulo_limpo} - 🍿Clau"

                  titulo_base = re.sub(r'(?i)\bT\d+E\d+\b', '', titulo_limpo).strip()
                  slug = re.sub(r'[^a-z0-9]', '_', titulo_base.lower())
                  slug = re.sub(r'_+', '_', slug).strip('_')
                  
                  if ep_tag:
                      novo_nome_arq = f"{slug}_{ep_tag.lower()}.json"
                      url_id = f"{slug}_{ep_tag.lower()}.html"
                  else:
                      novo_nome_arq = f"{slug}_{ano}.json" if ano else f"{slug}.json"
                      url_id = f"{slug}_{ano}.html" if ano else f"{slug}.html"

                  novo_json = {
                      "@context": "https://schema.org",
                      "@type": "VideoObject",
                      "@id": f"https://api-pobreflix-filmes.pages.dev/{url_id}",
                      "url": f"https://api-pobreflix-filmes.pages.dev/{url_id}",
                      "name": novo_nome_json,
                      "description": f"Assista {novo_nome_json}",
                      "thumbnailUrl": [thumb_atual],
                      "uploadDate": "2020-01-01T00:00:00+00:00",
                      "inLanguage": "pt",
                      "contentUrl": nova_url,
                      "embedUrl": nova_url
                  }

                  json_str = json.dumps(novo_json, ensure_ascii=False, indent=2)

                  is_video_file = nova_url.lower().endswith('.mp4') or nova_url.lower().endswith('.m3u8') or '.mp4?' in nova_url.lower()
                  
                  if is_video_file:
                      player_html = f"""<video id="player-video-{slug}" controls playsinline poster="{thumb_atual}" style="width: 100%; display: block; background: #000;">
                    <source src="{nova_url}" type="video/mp4">
                    Seu navegador não suporta vídeo HTML5.
                  </video>"""
                      script_html = f"const video = document.getElementById('player-video-{slug}');"
                  else:
                      player_html = f"""<div style="position: relative; padding-bottom: 56.25%; height: 0;">
                      <iframe src="{nova_url}" allowfullscreen sandbox="allow-same-origin allow-scripts allow-popups" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;"></iframe>
                  </div>"""
                      script_html = "const video = null;"

                  novo_html = template_base.replace("__JSON__", json_str).replace("__NOME__", novo_nome_json).replace("__CAPA__", thumb_atual).replace("__ID__", slug).replace("__SINOPSE__", sinopse).replace("__NOTA__", nota)
                  novo_html = novo_html.replace("__PLAYER__", player_html).replace("__SCRIPT_PLAYER__", script_html)
                  novo_html = novo_html.replace("https://redetoons.cards", "https://redetoons.my")

                  nome_arq_final = novo_nome_arq.replace(".json", ".html")
                  (dir_saida / nome_arq_final).write_text(novo_html, encoding='utf-8')
                  copiados += 1
                  
              except Exception as e:
                  print(f"[ERRO] Falha em {arq.name}: {e}")
                  dest_name = arq.name.replace('.json', '.html') if '.json' in arq.name else arq.name
                  shutil.copy2(arq, dir_saida / dest_name)

          if urls_quebradas:
              (dir_saida / "urls_invalidas.txt").write_text("\n".join(urls_quebradas), encoding="utf-8")
              
          print(f"Total de arquivos processados e padronizados: {copiados}")
          PYEOF

          sed -i "s|ORIGEM_PATH|$T/origem|g; s|NOVOS_PATH|$T/novos|g; s|SAIDA_PATH|$T/saida|g" "$T/filtrar.py"
          python3 -I "$T/filtrar.py"
          
          # CORREÇÃO AQUI: O `! -name "index.html"` protege o seu index de ser deletado
          find . -maxdepth 1 -name "*.json" -delete
          find . -maxdepth 1 -name "*.html" ! -name "index.html" -delete
          
          cp -f "$T"/saida/*.html .
          
          if [ -f "$T/saida/urls_invalidas.txt" ]; then 
            cp -f "$T/saida/urls_invalidas.txt" .
          fi

      - name: Salvar alterações
        run: |
          git config user.name "Claudineybr"
          git config user.email "Claudineybr@users.noreply.github.com"
          
          git add -A
          
          if git diff --cached --quiet; then
            echo "Sem mudancas."
            exit 0
          fi
          
          git commit -m "sync: aplicar card visual, player oculto e protecao do index.html"
          
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then
              echo "[SUCESSO] Push OK"
              exit 0
            fi
            echo "[FALHA] Conflito. Sincronizando..."
            git pull origin main --no-rebase -X ours --no-edit || true
            sleep $((RANDOM % 5 + 3))
          done

      - name: Disparar atualizacao do catalogo
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PAT_CHAIN }}
          REPO: ${{ github.repository }}
        run: |
          echo "🔁 Disparando workflow catalogo.yml..."
          sleep 5
          for i in {1..3}; do
            if gh workflow run "catalogo.yml" --repo "$REPO" --ref main; then
              echo "✅ Workflow catalogo.yml disparado com sucesso!"
              break
            else
              echo "⚠️ Erro ao disparar (tentativa $i/3). Tentando de novo em 10s..."
              sleep 10
            fi
          done
