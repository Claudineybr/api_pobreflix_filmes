name: Sincronizar, Limpar e Padronizar

on:
  schedule:
    - cron: '0 */12 * * *' # Roda a cada 12 horas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Baixar, Filtrar e Padronizar Nomes
        run: |
          set -e
          T=$(mktemp -d)
          
          # 1. Clona a fonte original e o seu catálogo
          git clone --depth 1 https://github.com/WaveLy2308/api_pobreflix_filmes.git "$T/origem" || true
          git clone --depth 1 https://github.com/Claudineybr/catalogocompleto.git "$T/novos"
          
          # 2. Roda o script Python
          cat > "$T/filtrar.py" << 'PYEOF'
          import re
          import shutil
          import unicodedata
          import json
          from pathlib import Path

          dir_origem = Path("ORIGEM_PATH") if Path("ORIGEM_PATH").exists() else None
          dir_novos = Path("NOVOS_PATH")
          dir_saida = Path("SAIDA_PATH")
          dir_saida.mkdir(parents=True, exist_ok=True)

          links_vistos = set()
          copiados = 0
          arquivos = []
          urls_quebradas = []
          
          # LISTA PARA O CATALOG.JSON
          catalogo = []

          # Lê tanto JSON quanto HTML da origem
          if dir_origem:
              arquivos.extend(list(dir_origem.glob("*.json")))
              arquivos.extend(list(dir_origem.glob("*.html")))
          arquivos.extend(list(dir_novos.glob("*.json")))
          arquivos.extend(list(dir_novos.glob("*.html")))

          def prioridade(arq):
              is_novo = 1 if dir_novos in arq.parents else 0
              return (is_novo, len(arq.name))
          arquivos.sort(key=prioridade, reverse=True)

          def extract_episode(text):
              if not text: return ""
              m = re.search(r'(?i)t\s*(\d+)\s*[._-]?\s*e\s*(\d+)', text)
              if m: return f"T{int(m.group(1))}E{int(m.group(2))}"
              m = re.search(r'(?i)t\s*(\d+)\s*[._-]?\s*ep\s*(\d+)', text)
              if m: return f"T{int(m.group(1))}E{int(m.group(2))}"
              m = re.search(r'(?i)temporada\s*(\d+).*?epis[oó]dio\s*(\d+)', text)
              if m: return f"T{int(m.group(1))}E{int(m.group(2))}"
              m = re.search(r'\b(\d{1,2})x(\d{1,3})\b', text)
              if m: return f"T{int(m.group(1))}E{int(m.group(2))}"
              return ""

          def limpar_titulo(raw_text):
              if not raw_text: return "Desconhecido"
              texto_norm = unicodedata.normalize('NFKD', str(raw_text))
              texto_norm = "".join([c for c in texto_norm if not unicodedata.combining(c)])
              for lixo in ['🍿Clau', '🕸️ PK', '🕸️', 'PK', '👾', 'Marcos', 'Clau', 'clau']:
                  texto_norm = texto_norm.replace(lixo, '')
              texto_norm = re.sub(r'(?i)t\s*\d+\s*[._-]?\s*e\s*\d+', '', texto_norm)
              texto_norm = re.sub(r'(?i)t\s*\d+\s*[._-]?\s*ep\s*\d+', '', texto_norm)
              texto_norm = re.sub(r'(?i)temporada\s*\d+.*?epis[oó]dio\s*\d+', '', texto_norm)
              texto_norm = re.sub(r'\b\d{1,2}x\d{1,3}\b', '', texto_norm)
              texto_norm = texto_norm.replace('_', ' ')
              partes = [p.strip() for p in re.split(r'\s+[-–—]\s+', texto_norm) if p.strip()]
              partes_limpas = [p for p in partes if not any(pref in p.lower() for pref in ['vini', 'marcos', 'inix', 'lili', 'estrelinha', 'grave', 'site', 'online', 'blogspot', 'assistir', 'download'])]
              titulo_base = partes_limpas[0] if partes_limpas else "Desconhecido"
              titulo_base = re.sub(r'\b(19\d{2}|20\d{2})\b', '', titulo_base).strip()
              return re.sub(r'[\s.:;,]+$', '', titulo_base).strip()

          def clean_url(url):
              if not url: return ""
              url = url.strip()
              url = re.sub(r'<[^>]+>', '', url)
              match = re.search(r'(https?://[^\s"]+)', url)
              if match: url = match.group(1)
              elif not url.startswith('http'): url = 'http://' + url
              return url.split()[0] if url.split() else ""

          for arq in arquivos:
              # Ignora arquivos de controle e o próprio catalog
              if any(x in arq.name for x in ['pendentes', 'fila', 'feitas', 'descartados', 'cache', 'renomeados', 'lista', 'catalog']): 
                  continue
                  
              try:
                  content = arq.read_text(encoding='utf-8-sig')
                  
                  url_match = re.search(r'"(?:contentUrl|embedUrl)"\s*:\s*"([^"]*)"', content)
                  url = url_match.group(1) if url_match else ""
                  nova_url = clean_url(url)
                  
                  if not nova_url:
                      urls_quebradas.append(arq.name)
                      nova_url = url if url else "http://quebrado.com/video.mp4"

                  clean_url_lower = nova_url.split('?')[0].lower()
                  if clean_url_lower in links_vistos: 
                      continue
                  links_vistos.add(clean_url_lower)

                  capa_url = "https://via.placeholder.com/500x750?text=Sem+Capa"
                  match_capa = re.search(r'"thumbnailUrl"\s*:\s*\[\s*"([^"]+)"', content)
                  if match_capa:
                      capa_url = match_capa.group(1)

                  match_name = re.search(r'"name"\s*:\s*"([^"]*)"', content)
                  nome_atual = match_name.group(1) if match_name else arq.name.replace('.json', '').replace('.html', '')
                  if len(nome_atual) < 5: nome_atual = arq.name.replace('.json', '').replace('.html', '')

                  ep_tag = extract_episode(nova_url)
                  if not ep_tag: ep_tag = extract_episode(nome_atual)
                  if not ep_tag: ep_tag = extract_episode(arq.name)

                  titulo_limpo = limpar_titulo(nome_atual)
                  match_ano = re.search(r'\b(19\d{2}|20\d{2})\b', nome_atual)
                  ano = match_ano.group(1) if match_ano else ""

                  if ep_tag:
                      novo_nome_json = f"{titulo_limpo} {ep_tag} - 🍿Clau"
                  else:
                      novo_nome_json = f"{titulo_limpo} ({ano}) - 🍿Clau" if ano else f"{titulo_limpo} - 🍿Clau"

                  novo_json = {
                      "@context": "https://schema.org", "@type": "VideoObject",
                      "name": novo_nome_json,
                      "description": f"Assista {novo_nome_json}",
                      "thumbnailUrl": [capa_url],
                      "uploadDate": "2020-01-01T00:00:00+00:00", "inLanguage": "pt",
                      "contentUrl": nova_url, "embedUrl": nova_url
                  }
                  
                  # ADICIONA AO CATALOGO
                  catalogo.append(novo_json)
                  
                  # MONTA O HTML
                  json_str = json.dumps(novo_json, ensure_ascii=False, indent=2)
                  html_lines = [
                      "<!DOCTYPE html>",
                      "<html lang=\"pt-BR\">",
                      "<head>",
                      "    <meta charset=\"UTF-8\">",
                      "    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">",
                      "    <script type=\"application/ld+json\">",
                      json_str,
                      "    </script>",
                      f"    <title>{novo_nome_json}</title>",
                      "    <style>",
                      "        body, html { margin: 0; padding: 0; background-color: #000; height: 100%; width: 100%; overflow: hidden; }",
                      "        video { width: 100%; height: 100%; outline: none; }",
                      "    </style>",
                      "</head>",
                      "<body>",
                      f"    <video src=\"{nova_url}\" poster=\"{capa_url}\" controls autoplay playsinline></video>",
                      "</body>",
                      "</html>"
                  ]
                  novo_html = "\n".join(html_lines).replace("https://redetoons.cards", "https://redetoons.my")

                  slug = re.sub(r'[^a-z0-9]', '_', titulo_limpo.lower())
                  slug = re.sub(r'_+', '_', slug).strip('_')
                  
                  # CORREÇÃO CRÍTICA AQUI: EXTENSÃO .html
                  if ep_tag:
                      novo_nome_arq = f"{slug}_{ep_tag.lower()}.html"
                  else:
                      novo_nome_arq = f"{slug}_{ano}.html" if ano else f"{slug}.html"

                  (dir_saida / novo_nome_arq).write_text(novo_html, encoding='utf-8')
                  copiados += 1
                  
              except Exception as e:
                  shutil.copy2(arq, dir_saida / arq.name)

          # SALVA O CATALOG.JSON NO FINAL
          if catalogo:
              (dir_saida / "catalog.json").write_text(json.dumps(catalogo, ensure_ascii=False, indent=2), encoding="utf-8")

          if urls_quebradas:
              (dir_saida / "urls_invalidas.txt").write_text("\n".join(urls_quebradas), encoding="utf-8")
              
          print(f"Total processados: {copiados}")
          print(f"Catalog.json gerado com {len(catalogo)} itens.")
          PYEOF

          sed -i "s|ORIGEM_PATH|$T/origem|g; s|NOVOS_PATH|$T/novos|g; s|SAIDA_PATH|$T/saida|g" "$T/filtrar.py"
          python3 -I "$T/filtrar.py"
          
          # LIMPA TUDO QUE É JSON E HTML ANTIGO (EXCETO O CATALOG)
          find . -maxdepth 1 -name "*.json" ! -name "catalog.json" -delete
          find . -maxdepth 1 -name "*.html" -delete
          
          # COPIA OS NOVOS ARQUIVOS
          cp -f "$T"/saida/*.html .
          cp -f "$T"/saida/*.json .
          if [ -f "$T/saida/urls_invalidas.txt" ]; then cp -f "$T/saida/urls_invalidas.txt" .; fi

      - name: Salvar alterações
        run: |
          git config user.name "Claudineybr"
          git config user.email "Claudineybr@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: EXTENSAO .HTML nos arquivos e geracao do catalog.json"
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then exit 0; fi
            git pull origin main --no-rebase -X ours --no-edit || true
            sleep 3
          done
