name: Sincronizar e corrigir
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Forcar atualizacao em massa (ignora o limite de 150 arquivos alterados)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Baixar, corrigir e publicar
        env:
          FORCE_MASS_UPDATE: ${{ inputs.forcar }}
        run: |
          set -eo pipefail
          T=$(mktemp -d)
          
          if [ -f "PAUSAR" ]; then
            echo "Repositorio pausado pelo usuario (arquivo PAUSAR na raiz). Nada foi feito."
            exit 0
          fi
          cat > "$T/convert.py" <<'PYEOF'
          import sys, re, json, shutil
          from pathlib import Path
          from urllib.parse import urlparse

          src, out = Path(sys.argv[1]), Path(sys.argv[2])
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True)

          LD_RE = re.compile(r'<script[^>]*type=["\']application/ld\+json["\'][^>]*>(.*?)</script>', re.S | re.I)
          PREFIX_RE = re.compile(r'(\\?"(?:contentUrl|embedUrl|player|url)\\?"\s*:\s*\\?")\d+\s+(https?://)')
          URLFIELD_RE = re.compile(r'("(?:contentUrl|embedUrl)"\s*:\s*")([^"]*)(")')
          NAMEDESC_RE = re.compile(r'^([ \t]*"(?:name|description)"[ \t]*:[ \t]*")(.*?)(",?)[ \t\r]*$', re.M)

          def fix_text(t):
              t = t.replace('🕸️ PK', '🍿Clau')
              t = t.replace('🕸️PK', '🍿Clau')
              t = t.replace('🕸️pk', '🍿Clau')
              t = t.replace('🕸️ pk', '🍿Clau')
              
              t, n_prefix = PREFIX_RE.subn(r'\1\2', t)
              return t, n_prefix

          def url_problem(v):
              if not isinstance(v, str) or not v:
                  return 'vazia'
              if re.search(r'\s', v):
                  return 'contém espaço'
              if '<' in v or '>' in v:
                  return 'contém tag HTML'
              u = urlparse(v)
              if u.scheme not in ('http', 'https'):
                  return 'sem esquema http/https'
              if not u.netloc:
                  return 'host vazio'
              return None

          def repair_url(v):
              if not isinstance(v, str) or url_problem(v) is None:
                  return v
              s = v.replace('<b></b>', '').strip()
              toks = s.split()
              http = [t for t in toks if re.match(r'https?://', t)]
              if http:
                  if len(set(http)) != 1:
                      return v
                  i = toks.index(http[0])
                  if all(re.fullmatch(r'[A-Za-z0-9]{1,8}', t) for t in toks[:i]) and len(toks) == i + len(http):
                      return http[0]
                  return v
              if len(toks) == 1 and re.fullmatch(r'[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+(:\d+)?/\S+\.mp4', toks[0]):
                  return 'http://' + toks[0]
              if len(toks) == 1 and re.fullmatch(r'https?://\S+', toks[0]):
                  return toks[0]
              return v

          def fix_quotes(b):
              def esc(m):
                  return m.group(1) + re.sub(r'(?<!\\)"', r'\\"', m.group(2)) + m.group(3)
              return NAMEDESC_RE.sub(esc, b)

          def repair_block(b):
              try:
                  json.loads(b)
              except Exception:
                  b = fix_quotes(b)
              return URLFIELD_RE.sub(lambda m: m.group(1) + repair_url(m.group(2)) + m.group(3), b)

          ok = []
          repaired = []
          prefix_fixed = []
          skipped = {}

          for p in sorted(src.glob('*.json')):
              name = p.name
              raw = p.read_bytes().decode('utf-8-sig')
              fixed, npx = fix_text(raw)

              if not raw.lstrip().startswith('<'):
                  try:
                      json.loads(fixed)
                  except Exception as e:
                      skipped[name] = f'JSON inválido: {e}'
                      continue
                  (out / name).write_bytes(fixed.encode('utf-8'))
                  ok.append(name)
                  continue

              blocks = LD_RE.findall(fixed)
              if not blocks:
                  skipped[name] = 'sem bloco JSON-LD'
                  continue
              blk = repair_block(blocks[0])
              if blk != blocks[0]:
                  fixed = fixed.replace(blocks[0], blk, 1)
                  repaired.append(name)
              try:
                  data = json.loads(blk)
              except Exception as e:
                  skipped[name] = f'JSON-LD inválido: {e}'
                  continue
              bad = None
              for k in ('contentUrl', 'embedUrl'):
                  pr = url_problem(data.get(k))
                  if pr:
                      bad = f'{k}: {pr}'
                      break
              if bad:
                  skipped[name] = bad
                  continue

              (out / name).write_bytes(fixed.encode('utf-8'))
              ok.append(name)
              if npx:
                  prefix_fixed.append(name)

          print('ok:', len(ok))
          print('prefixo corrigido:', len(prefix_fixed))
          print('reparados:', len(repaired), repaired)
          print('pulados:', len(skipped))
          for k, v in skipped.items():
              print('  ', k, '|', v)
          PYEOF
          
          git clone --depth 1 https://github.com/WaveLy2308/api_pobreflix_filmes.git "$T/origem"
          python3 -I "$T/convert.py" "$T/origem" "$T/saida"
          
          N_OUT=$(find "$T/saida" -maxdepth 1 -name '*.json' | wc -l)
          N_NOW=$(find . -maxdepth 1 -name '*.json' | wc -l)
          
          if [ "$N_OUT" -eq 0 ] || [ $((N_OUT * 10)) -lt $((N_NOW * 9)) ]; then
            echo "ABORTADO: saida com $N_OUT arquivos contra $N_NOW atuais"
            exit 1
          fi
          
          # Não apagamos nada: copiamos os arquivos bons por cima dos antigos
          sed -i 's#https://redetoons\.cards#https://redetoons.my#g' "$T"/saida/*.json
          
          CHANGED=0
          for f in "$T"/saida/*.json; do
            n=$(basename "$f")
            if [ ! -f "./$n" ] || ! cmp -s "$f" "./$n"; then
              CHANGED=$((CHANGED + 1))
            fi
          done
          echo "Arquivos novos ou alterados nesta rodada: $CHANGED"
          if [ "$CHANGED" -gt 150 ] && [ "${FORCE_MASS_UPDATE:-false}" != "true" ]; then
            echo "ABORTADO: $CHANGED arquivos mudariam (limite 150). Se for legitimo, rode manualmente com 'forcar' ligado."
            exit 1
          fi
          
          # Backup: guarda as 3 ultimas versoes anteriores de cada arquivo alterado,
          # em backup/<arquivo>/<data>_<hora>.json (horario de Boa Vista)
          STAMP=$(TZ=America/Boa_Vista date +%Y-%m-%d_%H-%M)
          mkdir -p backup
          for old in backup/*.json; do
            [ -f "$old" ] || continue
            b=$(basename "$old" .json)
            mkdir -p "backup/$b"
            mv "$old" "backup/$b/0000-00-00_00-00_antigo.json"
          done
          for f in "$T"/saida/*.json; do
            n=$(basename "$f")
            b="${n%.json}"
            if [ -f "./$n" ] && ! cmp -s "$f" "./$n"; then
              mkdir -p "backup/$b"
              cp -f "./$n" "backup/$b/$STAMP.json"
              ls -1 "backup/$b" | LC_ALL=C sort -r | tail -n +4 | while read -r velho; do
                rm -f "backup/$b/$velho"
              done
            fi
          done
          
          cp -f "$T"/saida/*.json .
          sed -i 's#https://redetoons\.cards#https://redetoons.my#g' ./*.json
          
          git add -A
          if git diff --cached --quiet; then
            echo "Sem mudancas."
            exit 0
          fi
          
          git config user.name "Claudineybr"
          git config user.email "Claudineybr@users.noreply.github.com"
          
          git diff --cached --name-only -- . ':!backup' | while read -r file; do
            clean_name="${file%.json}"
            git commit -m "Create/Update HTML: ${clean_name}" -- "$file"
          done
          
          if ! git diff --cached --quiet; then
            git commit -m "Backup: versoes anteriores dos arquivos alterados"
          fi
          
          git pull --rebase origin "${GITHUB_REF_NAME:-main}" || {
            git rebase --abort || true
            echo "ABORTADO: falha no rebase. Nada foi publicado."
            exit 1
          }
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"