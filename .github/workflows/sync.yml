name: Sincronizar e Limpar

on:
  schedule:
    - cron: '0 */2 * * *' # Roda a cada 2 horas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Baixar, Filtrar e Publicar
        run: |
          set -e
          T=$(mktemp -d)
          
          # 1. Clona a fonte original e o seu catálogo
          git clone --depth 1 https://github.com/WaveLy2308/api_pobreflix_filmes.git "$T/origem" || true
          git clone --depth 1 https://github.com/Claudineybr/catalogocompleto.git "$T/novos"
          
          # 2. Roda o script Python de filtragem
          cat > "$T/filtrar.py" << 'PYEOF'
          import json
          import re
          from pathlib import Path
          import shutil

          # Pegamos os caminhos passados pelo Bash
          dir_origem = Path("ORIGEM_PATH") if Path("ORIGEM_PATH").exists() else None
          dir_novos = Path("NOVOS_PATH")
          dir_saida = Path("SAIDA_PATH")
          dir_saida.mkdir(parents=True, exist_ok=True)

          links_vistos = set()
          copiados = 0
          arquivos = []

          if dir_origem:
              arquivos.extend(list(dir_origem.glob("*.json")))
          arquivos.extend(list(dir_novos.glob("*.json")))

          # A MÁGICA: Ordena pelo "peso" do arquivo.
          # 1. Os do repo novo têm prioridade (is_novo = 1)
          # 2. Nomes mais longos (provavelmente a versão mais recente e detalhada) vêm primeiro
          def prioridade(arq):
              is_novo = 1 if dir_novos in arq.parents else 0
              return (is_novo, len(arq.name))

          # Ordena do maior para o menor (os "mais recentes" primeiro)
          arquivos.sort(key=prioridade, reverse=True)

          for arq in arquivos:
              # Ignora arquivos de controle
              if any(x in arq.name for x in ['pendentes', 'fila', 'feitas', 'descartados']):
                  continue
                  
              try:
                  texto = arq.read_text(encoding='utf-8-sig')
                  match = re.search(r'<script type="application/ld\+json">(.*?)</script>', texto, re.S)
                  if match:
                      dados = json.loads(match.group(1))
                  else:
                      dados = json.loads(texto)
                      
                  url = dados.get("contentUrl", "").strip().lower()
                  
                  # Ignora links quebrados
                  if not url or url.endswith(".ts") or ".m3u8" in url:
                      continue
                      
                  # Se já vimos esse link, é porque o arquivo atual é mais antigo. Ignoramos.
                  if url in links_vistos:
                      continue
                      
                  links_vistos.add(url)
                  shutil.copy2(arq, dir_saida / arq.name)
                  copiados += 1
              except Exception:
                  pass

          print(f"Total de arquivos limpos e únicos copiados: {copiados}")
          PYEOF

          # Injeta os caminhos no script e roda
          sed -i "s|ORIGEM_PATH|$T/origem|g; s|NOVOS_PATH|$T/novos|g; s|SAIDA_PATH|$T/saida|g" "$T/filtrar.py"
          python3 -I "$T/filtrar.py"
          
          N_OUT=$(ls "$T"/saida/*.json | wc -l)
          if [ "$N_OUT" -eq 0 ]; then
            echo "ABORTADO: saida vazia."
            exit 1
          fi
          
          # 3. Aplica a marca d'água e arruma os domínios
          sed -i 's#https://redetoons\.cards#https://redetoons.my#g' "$T"/saida/*.json
          sed -i 's#🕸️ PK#🍿Clau#g' "$T"/saida/*.json
          
          # 4. Substitui tudo no repositório principal
          rm -f ./*.json
          cp -f "$T"/saida/*.json .
          
          # 5. Configura o Git e faz o commit
          git config user.name "Claudineybr"
          git config user.email "Claudineybr@users.noreply.github.com"
          
          git add -A
          if git diff --cached --quiet; then
            echo "Sem mudancas."
            exit 0
          fi
          
          git commit -m "sync: limpeza total, priorizando arquivos mais recentes"
          
          if ! git push origin HEAD:main; then
            echo "Conflito detectado. Sincronizando e forçando nossa versão..."
            git pull origin main --no-rebase -X ours --no-edit || true
            git push origin HEAD:main
          fi
