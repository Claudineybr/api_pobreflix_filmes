name: Sincronizar e corrigir (Massa com Backup)
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Baixar, corrigir e publicar
        run: |
          set -e
          T=$(mktemp -d)
          
          # 1. Clona as duas fontes
          git clone --depth 1 https://github.com/WaveLy2308/api_pobreflix_filmes.git "$T/origem"
          git clone --depth 1 https://github.com/Claudineybr/catalogocompleto.git "$T/novos"
          
          # 2. Junta tudo na pasta de saída (os novos têm prioridade)
          mkdir -p "$T/saida"
          cp -f "$T/origem"/*.json "$T/saida/" || true
          cp -f "$T/novos"/*.json "$T/saida/" || true
          
          N_OUT=$(ls "$T"/saida/*.json | wc -l)
          if [ "$N_OUT" -eq 0 ]; then
            echo "ABORTADO: saida vazia."
            exit 1
          fi
          
          # 3. Aplica marca d'água
          sed -i 's#https://redetoons\.cards#https://redetoons.my#g' "$T"/saida/*.json
          sed -i 's#🕸️ PK#🍿Clau#g' "$T"/saida/*.json
          
          # 4. SISTEMA DE BACKUP
          # Guarda a versão antiga dos arquivos que estão prestes a serem sobrescritos
          STAMP=$(TZ=America/Boa_Vista date +%Y-%m-%d_%H-%M)
          mkdir -p backup
          
          # Migra backups antigos do formato plano, se existirem
          for old in backup/*.json; do
            [ -f "$old" ] || continue
            b=$(basename "$old" .json)
            mkdir -p "backup/$b"
            mv "$old" "backup/$b/0000-00-00_00-00_antigo.json"
          done
          
          # Verifica quais arquivos vão ser alterados e faz o backup
          for f in "$T"/saida/*.json; do
            n=$(basename "$f")
            b="${n%.json}"
            if [ -f "./$n" ] && ! cmp -s "$f" "./$n"; then
              mkdir -p "backup/$b"
              cp -f "./$n" "backup/$b/$STAMP.json"
              # Mantém apenas as 3 últimas versões de cada arquivo
              ls -1 "backup/$b" | LC_ALL=C sort -r | tail -n +4 | while read -r velho; do
                rm -f "backup/$b/$velho"
              done
            fi
          done
          
          # 5. Substitui os arquivos no repositório principal
          rm -f ./*.json
          cp -f "$T"/saida/*.json .
          
          # 6. Configura o Git
          git config user.name "Claudineybr"
          git config user.email "Claudineybr@users.noreply.github.com"
          
          # 7. Faz o Commit do Backup (se houver)
          git add backup
          if ! git diff --cached --quiet; then
            git commit -m "Backup: versoes anteriores a atualizacao massiva"
          fi
          
          # 8. Faz o Commit Principal (Arquivos JSON)
          git add -A
          if git diff --cached --quiet; then
            echo "Sem mudancas nos arquivos."
            exit 0
          fi
          
          git commit -m "Atualizacao massiva: 15 mil itens + sync original"
          
          # 9. Push final
          git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"
