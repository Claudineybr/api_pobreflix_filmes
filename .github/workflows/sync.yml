name: Sincronizar, Limpar e Padronizar

# Junta a origem (WaveLy2308/api_pobreflix_filmes) com o catálogo novo (Claudineybr/catalogocompleto),
# limpa os nomes e gera TODOS os arquivos no HTML padrão (card com ▶ + HD).
#  - Filmes:  nome_do_filme_ano.html        | nome:  Nome (Ano) - 🍿Clau
#  - Séries:  nome_da_serie_t01ep01.html    | nome:  Nome - T1E1 – Título - 🍿Clau
# Segurança: se o resultado vier suspeito (poucos arquivos), NADA é apagado. Links sem conserto não viram link falso:
# o arquivo original é mantido e listado em urls_invalidas.txt. Dois vídeos com o mesmo nome nunca se sobrescrevem (_2, _3).

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Baixar, Filtrar e Padronizar
        run: |
          set -e
          T=$(mktemp -d)

          # 1. Clona a origem (opcional) e o catálogo de novos
          git clone --depth 1 https://github.com/WaveLy2308/api_pobreflix_filmes.git "$T/origem" || echo "(origem indisponível: sigo só com o catálogo novo)"
          git clone --depth 1 https://github.com/Claudineybr/catalogocompleto.git "$T/novos"

          # 2. Filtra, padroniza e troca os arquivos na raiz (com trava de segurança)
          cat > "$T/filtrar.py" << 'PYEOF'
          import json, re, shutil, sys, unicodedata, html as htmllib
          from pathlib import Path

          dir_origem = Path(sys.argv[1]) if Path(sys.argv[1]).exists() else None
          dir_novos = Path(sys.argv[2])
          dir_saida = Path(sys.argv[3])
          raiz = Path(sys.argv[4])
          SUFIXO = "🍿Clau"
          dir_saida.mkdir(parents=True, exist_ok=True)

          IGNORAR_NOMES = ("pendentes", "fila", "feitas", "feitos", "descartados", "consertados", "cache", "renomeados",
                           "lista", "erros", "totais", "package", "urls_invalidas")
          PROTEGIDOS = {"index.html", "serie.html"}

          TEMPLATE = """<!DOCTYPE html>
          <html lang="pt-BR">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <script type="application/ld+json">__JSON__</script>
          <title>__NOME__</title>
          <style>
            body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
            h1 { font-size: 24px; text-align: center; margin-bottom: 30px; }
          </style>
          </head>
          <body>

          <h1>__NOME__</h1>

          <div style="background: #0b0b12; border-radius:20px; overflow:hidden; box-shadow:0 25px 60px rgba(0,0,0,.8); margin:25px 0; border:1px solid rgba(255,255,255,.06);">

            <a href="__URL__" target="_blank" style="display: block; position: relative; text-decoration: none;">

              <img src="__CAPA__" style="width:100%; display:block;">

              <div style="position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,0.7), transparent);"></div>

              <div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); width:70px; height:70px; background:linear-gradient(135deg,#7a00ff,#c000ff); border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 0 20px rgba(120,0,255,.6); color:white; font-size:26px; border:2px solid rgba(255,255,255,.2);">▶</div>

              <div style="position:absolute; top:12px; right:12px; background:#ff003c; padding:6px 12px; border-radius:20px; font-size:11px; color:#fff; font-weight:bold;">HD</div>
            </a>

          </div>

          </body>
          </html>
          """

          # ---------------------------------------------------------------- limpeza de texto
          LIXO = re.compile(
              r"\U0001F47E+️?"                                   # 👾
              r"|\U0001F578️?\s*PK\b|\U0001F578️?"          # 🕸️ PK
              r"|\U0001F37F\s*Clau\b"                                  # 🍿Clau (o selo é recolocado depois)
              r"|(?:\bdo\s+)?@?vini\s*7x\w*"                           # ViNi7x
              r"|marc[\s_øo0-]{0,3}s[\s_]?x[\s_]?7(?![0-9])\w*",       # Marc Sx7 / marc_sx7 / Marcøsx7
              re.I)


          def normalizar(txt):
              """NFKC junta letras 'enfeitadas' (𝑽iNi𝟕x -> ViNi7x) e MANTÉM os acentos."""
              t = unicodedata.normalize("NFKC", str(txt or ""))
              t = LIXO.sub(" ", t)
              t = re.sub(r"\s*[-–—|]\s*Tankie\s*Tube\s*$", "", t, flags=re.I)
              return re.sub(r"\s+", " ", t).strip(" -–—|:")


          RX_ANO_COLCH = re.compile(r"\s*\[\s*((?:19|20)\d{2})\s*\]\s*(?:[‧·•].*)?$")
          RX_ANO_PAR = re.compile(r"\s*\(\s*((?:19|20)\d{2})\s*\)\s*$")
          RX_ANO_FIM = re.compile(r"\s+((?:19|20)\d{2})\s*$")
          RX_TRAIL = re.compile(r"(?:\s+(?:dublado|legendado|online|completo|hdcam|hdts|webrip|cam))+$", re.I)
          RX_SERIE = re.compile(
              r"^(?P<serie>.+?)\s*[-–—]?\s*\bT(?P<t>\d{1,2})\s*E(?:P)?(?P<e>\d{1,3})\b(?:\s*[-–—:]\s*(?P<tit>.+))?$", re.I)
          RX_ARQ_SERIE = re.compile(r"_t(\d{1,2})e(?:p)?(\d{1,3})(?:_\d+)?$", re.I)


          def titulo_e_ano(bruto):
              t = normalizar(bruto)
              ano = ""
              for rx in (RX_ANO_COLCH, RX_ANO_PAR):
                  m = rx.search(t)
                  if m:
                      ano = m.group(1)
                      t = t[:m.start()]
                      break
              else:
                  m = RX_ANO_FIM.search(t)
                  if m and len(t[:m.start()].strip()) >= 2:   # "2012" sozinho é o título, não um ano
                      ano = m.group(1)
                      t = t[:m.start()]
              t = RX_TRAIL.sub("", t.strip(" -–—|:"))
              t = re.sub(r"[\s.:;,\-–—]+$", "", t).strip()
              return (t or "Desconhecido"), ano


          def slug(txt):
              t = unicodedata.normalize("NFKD", txt).encode("ascii", "ignore").decode()
              return re.sub(r"_+", "_", re.sub(r"[^a-z0-9]", "_", t.lower())).strip("_") or "sem_titulo"


          # ---------------------------------------------------------------- links
          def reparar_link(link):
              """ttp:// ttps:// https:https:// //host host.com/x consertados; texto solto/cortado -> None."""
              if not isinstance(link, str):
                  return None
              l = link.strip().strip("\"'")
              l = re.sub(r"<[^>]+>", "", l).strip()
              l = re.sub(r"^https?:(?=https?://)", "", l, flags=re.I)
              l = re.sub(r"^h?ttp(s?)://", lambda m: "http" + m.group(1) + "://", l, flags=re.I)
              if l.startswith("//"):
                  l = "https:" + l
              elif not re.match(r"https?://", l, re.I) and re.match(r"[a-z0-9-]+(?:\.[a-z0-9-]+)+/", l, re.I):
                  l = "https://" + l
              l = re.sub(r"^(https?://(?:www\.)?tankie\.tube)/w/([\w-]+)", r"\1/videos/embed/\2", l, flags=re.I)
              l = l.replace("https://redetoons.cards", "https://redetoons.my")
              if re.fullmatch(r"https?://[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+(?::\d+)?(?:[/?#].*)?", l):
                  return l
              return None


          def montar(nome, url, capa):
              dados = {
                  "@context": "https://schema.org", "@type": "VideoObject",
                  "supportPlatform": ["https://schema.org/IOSPlatform", "https://schema.org/AndroidPlatform"],
                  "name": nome, "description": f"Assista {nome}", "thumbnailUrl": [capa], "contentUrl": url,
              }
              js = json.dumps(dados, ensure_ascii=False, indent=2).replace("</", "<\\/")
              return (TEMPLATE.replace("__JSON__", js).replace("__NOME__", htmllib.escape(nome))
                      .replace("__URL__", htmllib.escape(url, quote=True)).replace("__CAPA__", htmllib.escape(capa, quote=True)))


          # ---------------------------------------------------------------- coleta
          def pular(arq):
              n = arq.name.lower()
              return n in PROTEGIDOS or any(x in n for x in IGNORAR_NOMES)


          arquivos = []
          if dir_origem:
              arquivos += sorted(dir_origem.glob("*.json")) + sorted(dir_origem.glob("*.html"))
          arquivos += sorted(dir_novos.glob("*.json")) + sorted(dir_novos.glob("*.html"))
          # o catálogo novo vence a origem; entre arquivos do mesmo lugar, o nome mais longo (mais completo) vence
          arquivos.sort(key=lambda a: (1 if dir_novos in a.parents else 0, len(a.name)), reverse=True)

          links_vistos, nomes_usados = set(), {}
          feitos = duplicados = copiados_originais = 0
          invalidos = []

          for arq in arquivos:
              if pular(arq):
                  continue
              try:
                  texto = arq.read_text(encoding="utf-8-sig")
                  m_url = re.search(r'"(?:contentUrl|embedUrl)"\s*:\s*"([^"]*)"', texto)
                  url_bruta = m_url.group(1) if m_url else ""
                  url = reparar_link(url_bruta)
                  if not url:
                      # link sem conserto: NÃO inventa link falso; mantém o arquivo original como está e lista no relatório
                      invalidos.append(f"{arq.name}  ->  {url_bruta[:100]}")
                      destino = arq.name[:-5] + ".html" if arq.name.endswith(".json") else arq.name
                      if destino not in nomes_usados:
                          shutil.copy2(arq, dir_saida / destino)
                          nomes_usados[destino] = None
                          copiados_originais += 1
                      continue

                  chave = url.split("?")[0].lower()
                  if chave in links_vistos:
                      duplicados += 1
                      continue
                  links_vistos.add(chave)

                  m_nome = re.search(r'"name"\s*:\s*"((?:[^"\\]|\\.)*)"', texto)
                  try:
                      nome_atual = json.loads('"' + m_nome.group(1) + '"') if m_nome else ""
                  except Exception:
                      nome_atual = m_nome.group(1) if m_nome else ""
                  base_arq = re.sub(r"\.(json|html)$", "", arq.name)
                  if len(nome_atual) < 5:
                      nome_atual = base_arq.replace("_", " ").title()

                  m_thumb = re.search(r'"thumbnailUrl"\s*:\s*(?:\[\s*)?"([^"]*)"', texto)
                  capa = (m_thumb.group(1) if m_thumb else "").replace("https://redetoons.cards", "https://redetoons.my")
                  if not capa.startswith("http"):
                      capa = "https://placehold.co/500x750?text=Sem+Capa"

                  base_nome = re.sub(rf"\s*-\s*{SUFIXO}\s*$", "", unicodedata.normalize("NFKC", nome_atual)).strip()
                  base_nome = normalizar(base_nome)
                  m_n = RX_SERIE.match(base_nome)
                  m_a = RX_ARQ_SERIE.search(base_arq)
                  if m_n or m_a:
                      t, e = (int(m_n["t"]), int(m_n["e"])) if m_n else (int(m_a[1]), int(m_a[2]))
                      if m_n:
                          serie, tit = m_n["serie"].strip(" -–—|:"), (m_n["tit"] or "").strip(" -–—|:")
                      else:
                          serie, tit = base_nome, ""
                      serie = titulo_e_ano(serie)[0]
                      nome = f"{serie} - T{t}E{e}" + (f" – {tit}" if tit else "") + f" - {SUFIXO}"
                      stem = f"{slug(serie)}_t{t:02d}ep{e:02d}"
                  else:
                      titulo, ano = titulo_e_ano(base_nome)
                      nome = f"{titulo} ({ano}) - {SUFIXO}" if ano else f"{titulo} - {SUFIXO}"
                      stem = f"{slug(titulo)}_{ano}" if ano else slug(titulo)

                  # dois vídeos diferentes com o mesmo nome: nunca sobrescreve (o segundo vira _2, _3...)
                  final, i = f"{stem}.html", 2
                  while final in nomes_usados and nomes_usados[final] != chave:
                      final = f"{stem}_{i}.html"
                      i += 1
                  nomes_usados[final] = chave
                  (dir_saida / final).write_text(montar(nome, url, capa), encoding="utf-8")
                  feitos += 1
              except Exception as ex:
                  print(f"[ERRO] Falha em {arq.name}: {ex}")
                  destino = arq.name[:-5] + ".html" if arq.name.endswith(".json") else arq.name
                  if destino not in nomes_usados:
                      shutil.copy2(arq, dir_saida / destino)
                      nomes_usados[destino] = None
                      copiados_originais += 1

          total_saida = feitos + copiados_originais
          atuais = [f for f in raiz.glob("*.html") if f.name not in PROTEGIDOS]
          print(f"Padronizados: {feitos} | originais mantidos (link sem conserto/erro): {copiados_originais} | "
                f"duplicados descartados (mesmo vídeo): {duplicados} | links inválidos: {len(invalidos)}")

          # ---------------------------------------------------------------- trava de segurança
          if total_saida == 0 or (len(atuais) > 50 and total_saida < len(atuais) * 0.5):
              print(f"::error::Resultado suspeito ({total_saida} arquivos gerados para {len(atuais)} existentes). "
                    "Nada foi apagado nem alterado.")
              sys.exit(1)

          # ---------------------------------------------------------------- troca na raiz (só os arquivos do catálogo)
          for f in list(raiz.glob("*.html")) + list(raiz.glob("*.json")):
              if f.name in PROTEGIDOS or pular(f):
                  continue
              f.unlink()
          for f in dir_saida.glob("*.html"):
              shutil.copy2(f, raiz / f.name)
          inv = raiz / "urls_invalidas.txt"
          if invalidos:
              inv.write_text("\n".join(invalidos), encoding="utf-8")
          elif inv.exists():
              inv.unlink()
          print("Raiz atualizada.")
          PYEOF

          python3 -I "$T/filtrar.py" "$T/origem" "$T/novos" "$T/saida" "$PWD"

      - name: Salvar alterações
        run: |
          git config user.name "Claudineybr"
          git config user.email "Claudineybr@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "Sem mudancas."
            exit 0
          fi
          git diff --cached --shortstat
          git commit -m "sync: padroniza nomes e HTML (card padrão)"

          for i in $(seq 1 5); do
            if git push origin HEAD:main; then
              echo "[SUCESSO] Push OK"
              exit 0
            fi
            echo "[FALHA] Conflito. Sincronizando..."
            git pull origin main --no-rebase -X ours --no-edit || true
            sleep $((RANDOM % 5 + 3))
          done
          echo "::error::Não consegui dar push depois de 5 tentativas"
          exit 1

      - name: Disparar atualizacao do catalogo
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PAT_CHAIN }}
          REPO: ${{ github.repository }}
        run: |
          echo "🔁 Disparando workflow catalogo.yml..."
          sleep 5
          for i in {1..3}; do
            if gh workflow run "catalogo.yml" --repo "$REPO" --ref main; then
              echo "✅ Workflow catalogo.yml disparado com sucesso!"
              break
            else
              echo "⚠️ Erro ao disparar (tentativa $i/3). Tentando de novo em 10s..."
              sleep 10
            fi
          done
