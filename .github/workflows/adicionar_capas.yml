name: Baixar Capas Oficiais do Site

on:
  schedule:
    - cron: '0 0 * * *' # Rede de segurança
  workflow_dispatch:       # Permite rodar na mão

permissions:
  contents: write

concurrency:
  group: baixar-capas-site
  cancel-in-progress: false

jobs:
  extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar dependencias
        run: pip install beautifulsoup4 requests

      - name: Raspar e Atualizar Capas
        run: |
          cat > raspar_capas.py << 'PYEOF'
          import requests
          import time
          import sys
          import re
          import unicodedata
          import json
          from bs4 import BeautifulSoup
          from pathlib import Path

          BASE_URL = "https://www.vini7xgrave.site"
          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
          
          ARQ_FILA_FILMES = Path("filmes_fila.txt")
          ARQ_FILA_SERIES = Path("series_fila.txt")
          ARQ_PROCESSADOS = Path("capas_baixadas.txt")

          # 1. Mapeia os arquivos locais
          print("Mapeando arquivos locais...")
          mapa_jsons = {}
          for arq in Path(".").glob("*.json"):
              if any(x in arq.name for x in ['pendentes', 'fila', 'feitas', 'descartados', 'cache']): 
                  continue
              try:
                  txt = arq.read_text(encoding="utf-8")
                  soup = BeautifulSoup(txt, "html.parser")
                  script = soup.find("script", type="application/ld+json")
                  if script:
                      dados = json.loads(script.string)
                      nome = dados.get("name", "")
                      nome_base = re.sub(r'(?i)\bT\d+E\d+\b', '', nome).strip()
                      nome_base = re.sub(r'[\s\-]+$', '', nome_base).strip()
                      mapa_jsons[nome_base.lower()] = arq.name
              except: pass
          
          print(f"Total de JSONs mapeados: {len(mapa_jsons)}")

          # 2. Lê os links do site
          urls = []
          if ARQ_FILA_FILMES.exists():
              urls.extend([u.strip() for u in ARQ_FILA_FILMES.read_text(encoding="utf-8").splitlines() if u.strip()])
          if ARQ_FILA_SERIES.exists():
              urls.extend([u.strip() for u in ARQ_FILA_SERIES.read_text(encoding="utf-8").splitlines() if u.strip()])
          
          urls = list(dict.fromkeys(urls)) # Remove duplicatas
          
          processados = set()
          if ARQ_PROCESSADOS.exists():
              processados = set(l.strip() for l in ARQ_PROCESSADOS.read_text(encoding="utf-8").splitlines() if l.strip())

          faltam = [u for u in urls if u not in processados]
          lote = faltam[:300] # Processa 300 links por vez

          print(f"Total na fila: {len(urls)} | Faltam: {len(faltam)} | Processando lote de: {len(lote)}")

          def limpar_titulo(raw_text):
              if not raw_text: return "Desconhecido"
              texto_norm = unicodedata.normalize('NFKD', str(raw_text))
              texto_norm = "".join([c for c in texto_norm if not unicodedata.combining(c)])
              for lixo in ['🍿Clau', '🕸️ PK', '🕸️', 'PK', '👾', 'Marcos', 'Clau', 'clau']:
                  texto_norm = texto_norm.replace(lixo, '')
              texto_norm = re.sub(r'(?i)\bT\d+E\d+\b', '', texto_norm)
              texto_norm = re.sub(r'(?i)_t\d+e\d+', '', texto_norm)
              partes = [p.strip() for p in re.split(r'\s+[-–—]\s+', texto_norm) if p.strip()]
              partes_limpas = []
              for p in partes:
                  p_lower = p.lower()
                  if any(pref in p_lower for pref in ['vini', 'marcos', 'inix', 'lili', 'estrelinha', 'grave', 'site', 'online', 'blogspot', 'assistir', 'download']):
                      continue
                  partes_limpas.append(p)
              titulo_final = ' - '.join(partes_limpas) if partes_limpas else partes[0] if partes else "Desconhecido"
              titulo_final = re.sub(r'(?i)\bT\d+E\d+\b', '', titulo_final).strip()
              titulo_final = re.sub(r'\s*\(?\d{4}\)?\s*$', '', titulo_final).strip()
              return titulo_final if titulo_final else "Desconhecido"

          sucessos = 0
          falhas = 0

          for i, url in enumerate(lote):
              try:
                  print(f"[{i+1}/{len(lote)}] Acessando: {url}", end=" ... ")
                  r = requests.get(url, headers=HEADERS, timeout=15)
                  
                  if r.status_code == 200:
                      soup = BeautifulSoup(r.text, 'html.parser')
                      og_img = soup.find('meta', property='og:image')
                      
                      if og_img and og_img.get('content'):
                          img_url = og_img['content']
                          
                          h1 = soup.find('h1')
                          title_text = h1.get_text(strip=True) if h1 else (soup.title.text if soup.title else "")
                          titulo_limpo = limpar_titulo(title_text)
                          
                          if titulo_limpo.lower() in mapa_jsons:
                              arq_json_nome = mapa_jsons[titulo_limpo.lower()]
                              arq_json = Path(arq_json_nome)
                              
                              # 3. ATUALIZA O JSON (usando BeautifulSoup e json.loads)
                              txt = arq_json.read_text(encoding="utf-8")
                              soup_local = BeautifulSoup(txt, 'html.parser')
                              script_local = soup_local.find("script", type="application/ld+json")
                              
                              if script_local:
                                  try:
                                      dados = json.loads(script_local.string)
                                      # Substitui a capa
                                      if dados.get("thumbnailUrl") != [img_url]:
                                          dados["thumbnailUrl"] = [img_url]
                                          
                                          # Escreve o novo JSON de volta no HTML
                                          novo_script_str = json.dumps(dados, ensure_ascii=False, indent=2)
                                          novo_html = txt.replace(script_local.string, novo_script_str)
                                          arq_json.write_text(novo_html, encoding="utf-8")
                                          print(f"CAPA ATUALIZADA! ({arq_json_nome})")
                                          sucessos += 1
                                      else:
                                          print("capa já estava atualizada.")
                                  except Exception as e:
                                      print(f"Erro ao processar JSON interno: {e}")
                          else:
                              print(f"JSON não encontrado para o título: '{titulo_limpo}'")
                              falhas += 1
                      else:
                          print("Sem og:image na página.")
                          falhas += 1
                  else:
                      print(f"Erro HTTP {r.status_code}")
                      falhas += 1
                      
              except Exception as e:
                  print(f"Erro: {e}")
                  falhas += 1
              
              with open(ARQ_PROCESSADOS, "a", encoding="utf-8") as f:
                  f.write(url + "\n")
                  
              time.sleep(1)

          print(f"\nFinalizado! {sucessos} capas adicionadas, {falhas} falhas.")
          PYEOF

          python3 raspar_capas.py

      - name: Salvar arquivos e progresso
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -f capas_baixadas.txt 2>/dev/null || true
          git add *.json
          git add *.txt
          
          if git diff --cached --quiet; then
            echo "Nada novo."
            exit 0
          fi
          
          git commit -m "feat: adicionar capas oficiais do site aos HTMLs"
          
          for i in $(seq 1 10); do
            if git push origin HEAD:main; then
              echo "[SUCESSO] Push OK"
              exit 0
            fi
            echo "[FALHA] Push falhou. Sincronizando..."
            git pull --rebase origin main --autostash || git pull origin main --no-rebase -X ours --no-edit
            sleep $((RANDOM % 10 + 5))
          done
          exit 1

      - name: Disparar proxima run
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PAT_CHAIN }}
          REPO: ${{ github.repository }}
        run: |
          TOTAL=$(cat filmes_fila.txt series_fila.txt 2>/dev/null | sort -u | wc -l)
          PROCESSADOS=$(wc -l < capas_baixadas.txt 2>/dev/null || echo 0)
          FALTAM=$((TOTAL - PROCESSADOS))
          
          echo "Total: $TOTAL | Processados: $PROCESSADOS | Faltam: $FALTAM"
          
          if [ "$FALTAM" -le 0 ]; then
            echo "✅ Todas as capas do site foram processadas!"; exit 0
          fi

          echo "🔁 Disparando proxima run em 30 segundos..."
          sleep 30
          
          for i in {1..5}; do
            if gh workflow run "adicionar_capas.yml" --repo "$REPO" --ref main; then
              echo "✅ Proxima run disparada!"
              break
            else
              echo "⚠️ Erro ao disparar (tentativa $i/5). Tentando de novo em 15s..."
              sleep 15
            fi
          done
