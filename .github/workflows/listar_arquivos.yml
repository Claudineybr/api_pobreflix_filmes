name: Gerar Lista de Arquivos JSON

on:
  workflow_dispatch: # Roda na mão

permissions:
  contents: write

jobs:
  listar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5

      - name: Listar os arquivos JSON
        run: |
          echo "Gerando lista de arquivos..."
          
          # Lista todos os arquivos .json, ordena alfabeticamente e salva no txt
          ls -1 *.json 2>/dev/null | sort > lista_arquivos.txt
          
          # Conta quantos arquivos existem
          TOTAL=$(wc -l < lista_arquivos.txt)
          echo "Total de arquivos JSON encontrados: $TOTAL"

      - name: Salvar e enviar a lista
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add lista_arquivos.txt
          
          if git diff --cached --quiet; then
            echo "A lista não mudou."
            exit 0
          fi
          
          git commit -m "chore: gerar lista de arquivos JSON"
          
          for i in $(seq 1 5); do
            if git push origin HEAD:main; then
              echo "[SUCESSO] Lista gerada e enviada!"
              exit 0
            fi
            git pull --rebase origin main --autostash || true
            sleep 3
          done
